<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단어시험 & 포인트 관리 시스템</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface2: #2d2d2d;
      --border: #3d3d3d;
      --text: #e0e0e0;
      --accent: #4da6ff;
      --accent2: #bb86fc;
      --green: #2dd4a0;
      --red: #ff6b6b;
    }
    body {
      margin: 0; padding: 20px;
      background: var(--bg); color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
    }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; box-sizing: border-box;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 14px;
    }
    .btn {
      border: none; border-radius: 8px; padding: 10px 16px;
      font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-success { background: var(--green); color: #000; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-full { width: 100%; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; color: #888; font-weight: 600; }
    .tab.active { background: var(--surface2); color: #fff; }
    .panel { display: none; }
    .panel.active { display: block; }
    .flex { display: flex; justify-content: space-between; align-items: center; }
    .small { font-size: 12px; color: #aaa; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    .badge-active { background: rgba(45, 212, 160, 0.15); color: var(--green); }
    .badge-ended { background: rgba(255, 107, 107, 0.15); color: var(--red); }
    .badge-winner { background: rgba(77, 166, 255, 0.15); color: var(--accent); }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent2); color: #000; padding: 10px 20px; border-radius: 20px;
      font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <!-- 로그인 화면 -->
  <div id="loginCard" class="card">
    <h2 style="margin-top:0;">로그인</h2>
    <div class="field">
      <label>아이디</label>
      <input type="text" id="loginId" placeholder="아이디 입력">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력">
    </div>
    <button class="btn btn-primary btn-full" onclick="login()">로그인</button>
    <div id="loginErr" class="red small" style="margin-top:8px; display:none;">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  </div>

  <!-- 학생 메인 화면 -->
  <div id="studentMain" style="display:none;">
    <div class="card flex">
      <div>
        <strong id="studentName" style="font-size:18px;">학생</strong>
        <div class="small">내 포인트: <span id="studentPoints" class="green" style="font-size:16px; font-weight:800;">0</span> PT</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="logout()">로그아웃</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="studentTab('vocab', this)">단어시험</div>
    </div>

    <div id="s-vocab" class="panel active">
      <div id="studentVocabList"></div>
    </div>
  </div>

  <!-- 교사/관리자 메인 화면 -->
  <div id="adminMain" style="display:none;">
    <div class="card flex">
      <strong style="font-size:18px;">관리자 대시보드</strong>
      <button class="btn btn-danger btn-sm" onclick="logout()">로그아웃</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="adminTab('vocab', this)">단어시험 관리</div>
    </div>

    <div id="a-vocab" class="panel active">
      <div id="adminVocabList"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const FIREBASE_URL = "https://point-7419d-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";

// 사용하실 단어 목록을 이곳에 자유롭게 추가/수정하시면 됩니다.
const VOCAB_DATA = {
  "day1": [["apple", "사과"], ["banana", "바나나"], ["cat", "고양이"]],
  "day2": [["dog", "개"], ["elephant", "코끼리"], ["flower", "꽃"]]
};

let DATA = { students:[], items:[], orders:[], auctions:{}, vocabTests:{}, vocabSubmissions:{} };
let currentUser = null;

window.onload = function() {
  loadData();
};

async function loadData(){
  try{
    let r = await fetch(FIREBASE_URL);
    let d = await r.json();
    if(d){
      DATA = d;
      if(!DATA.students) DATA.students = [];
      if(!DATA.vocabTests) DATA.vocabTests = {};
      if(!DATA.vocabSubmissions) DATA.vocabSubmissions = {};
    }
  }catch(e){
    console.error("데이터 로드 실패:", e);
  }
}

async function saveData(){
  try{
    await fetch(FIREBASE_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(DATA)
    });
  }catch(e){
    console.error("데이터 저장 실패:", e);
  }
}

async function login(){
  await loadData();
  let id = document.getElementById('loginId').value.trim();
  let pw = document.getElementById('loginPw').value.trim();
  let err = document.getElementById('loginErr');
  if(err) err.style.display = 'none';

  if(id === 'admin' && pw === 'admin1234'){
    currentUser = { role:'admin', name:'관리자' };
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminMain').style.display = 'block';
    renderAdmin();
    return;
  }

  let st = DATA.students.find(s => s.id === id && s.pw === pw);
  if(st){
    currentUser = { role:'student', ...st };
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('studentMain').style.display = 'block';
    document.getElementById('studentName').innerText = `${st.name} 학생`;
    renderStudent();
    return;
  }
  if(err) err.style.display = 'block';
}

function logout(){
  currentUser = null;
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('studentMain').style.display = 'none';
  document.getElementById('adminMain').style.display = 'none';
}

// 교사: 시험 열기/닫기 (마감해도 기존 제출 내역과 포인트 유지)
async function toggleVocabTest(day){
  await loadData();
  let currentStatus = DATA.vocabTests[day] || false;
  DATA.vocabTests[day] = !currentStatus;
  
  await saveData();
  showToast(DATA.vocabTests[day] ? `${day} 시험이 열렸습니다.` : `${day} 시험이 마감되었습니다.`);
  renderAdminVocab();
}

function renderAdminVocab(){
  let h = '';
  Object.keys(VOCAB_DATA).forEach(day => {
    let isOpen = DATA.vocabTests[day] || false;
    let submittedStudents = [];
    
    if(DATA.vocabSubmissions && DATA.vocabSubmissions[day]){
      Object.keys(DATA.vocabSubmissions[day]).forEach(stId => {
        let sub = DATA.vocabSubmissions[day][stId];
        let wrongWords = sub.details ? sub.details.filter(w => !w.isCorrect) : [];
        submittedStudents.push({ ...sub, wrongWords });
      });
    }

    h += `<div class="card">
      <div class="flex">
        <div>
          <strong style="font-size:16px">${day.toUpperCase()} (${VOCAB_DATA[day].length}단어)</strong>
          <div class="small">상태: ${isOpen ? '<span class="green">응시 가능 (OPEN)</span>' : '<span class="red">마감됨 (CLOSED)</span>'}</div>
        </div>
        <button class="btn ${isOpen ? 'btn-danger' : 'btn-success'} btn-sm" onclick="toggleVocabTest('${day}')">
          ${isOpen ? '시험 닫기' : '시험 열기'}
        </button>
      </div>`;

    if(submittedStudents.length > 0){
      h += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
        <div class="small" style="font-weight:700;color:var(--accent2);margin-bottom:6px">학생별 오답 제출 내역</div>`;
      submittedStudents.forEach(st => {
        h += `<div style="background:var(--surface2);padding:10px;border-radius:8px;margin-bottom:6px;">
          <div class="flex">
            <strong>${st.studentName} (${st.studentId})</strong>
            <span class="green" style="font-weight:bold">${st.score}점 획득</span>
          </div>`;
        
        if(st.wrongWords.length > 0){
          h += `<div class="red" style="font-size:12px;margin-top:4px">
            틀린 단어 (${st.wrongWords.length}개): ${st.wrongWords.map(w => `${w.word}(작성: ${w.userAns || '미입력'})`).join(', ')}
          </div>`;
        } else {
          h += `<div class="green" style="font-size:12px;margin-top:4px">만점 (틀린 단어 없음)</div>`;
        }
        h += `</div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  });
  
  document.getElementById('adminVocabList').innerHTML = h;
}

function renderStudentVocab(){
  let h = '';
  Object.keys(VOCAB_DATA).forEach(day => {
    let isOpen = DATA.vocabTests[day] || false;
    let mySub = (DATA.vocabSubmissions && DATA.vocabSubmissions[day]) ? DATA.vocabSubmissions[day][currentUser.id] : null;

    h += `<div class="card flex" style="align-items:center;">
      <div>
        <strong style="font-size:16px">${day.toUpperCase()}</strong>
        <span class="small" style="margin-left:8px">총 ${VOCAB_DATA[day].length}문항</span>
      </div>`;

    if(mySub){
      h += `<div>
        <span class="badge badge-winner" style="margin-right:8px">제출완료 (${mySub.score}점)</span>
        <button class="btn btn-primary btn-sm" onclick="viewMyWrongAnswers('${day}')">오답 노트</button>
      </div>`;
    } else if(isOpen){
      h += `<div>
        <span class="badge badge-active" style="margin-right:8px">응시 가능</span>
        <button class="btn btn-success btn-sm" onclick="startQuiz('${day}')">응시하기</button>
      </div>`;
    } else {
      h += `<span class="badge badge-ended">마감됨</span>`;
    }
    h += `</div>`;
  });
  
  document.getElementById('studentVocabList').innerHTML = h;
}

function viewMyWrongAnswers(day){
  let mySub = DATA.vocabSubmissions[day][currentUser.id];
  let h = `<div class="card">
    <div class="flex" style="margin-bottom:12px">
      <h3>${day.toUpperCase()} 내 제출 결과</h3>
      <button class="btn btn-danger btn-sm" onclick="renderStudentVocab()">목록으로</button>
    </div>
    <div style="margin-bottom:12px"><strong>획득 점수:</strong> <span class="green">${mySub.score}점</span></div>`;

  mySub.details.forEach((item, idx) => {
    h += `<div style="background:var(--surface2);padding:10px;border-radius:8px;margin-bottom:6px;border:1px solid ${item.isCorrect ? 'rgba(45,212,160,.4)' : 'rgba(255,107,107,.4)'}">
      <div><strong>${idx+1}. ${item.word}</strong> (정답: ${item.correctAns})</div>
      <div class="small" style="margin-top:4px">
        내가 쓴 답: <span class="${item.isCorrect ? 'green' : 'red'}" style="font-weight:700">${item.userAns || '미입력'}</span>
      </div>
    </div>`;
  });
  h += `</div>`;
  
  document.getElementById('studentVocabList').innerHTML = h;
}

function startQuiz(day){
  let words = VOCAB_DATA[day];
  let h = `<div class="card">
    <div class="flex" style="margin-bottom:16px">
      <h3>${day.toUpperCase()} 단어시험</h3>
      <button class="btn btn-danger btn-sm" onclick="renderStudentVocab()">취소</button>
    </div>`;
  
  words.forEach((w, i) => {
    h += `<div class="field">
      <label>${i+1}. ${w[0]}</label>
      <input type="text" id="q_${i}" placeholder="뜻을 입력하세요">
    </div>`;
  });

  h += `<button class="btn btn-primary btn-full" onclick="submitQuiz('${day}')" style="margin-top:12px">제출하기</button></div>`;
  
  document.getElementById('studentVocabList').innerHTML = h;
}

async function submitQuiz(day){
  await loadData();
  let words = VOCAB_DATA[day];
  let score = 0;
  let details = [];

  words.forEach((w, i) => {
    let inputElem = document.getElementById(`q_${i}`);
    let userAns = inputElem ? inputElem.value.trim() : '';
    let isCorrect = userAns === w[1].trim();
    if(isCorrect) score += 10;

    details.push({
      word: w[0],
      correctAns: w[1],
      userAns: userAns,
      isCorrect: isCorrect
    });
  });

  if(!DATA.vocabSubmissions) DATA.vocabSubmissions = {};
  if(!DATA.vocabSubmissions[day]) DATA.vocabSubmissions[day] = {};

  DATA.vocabSubmissions[day][currentUser.id] = {
    studentId: currentUser.id,
    studentName: currentUser.name,
    score: score,
    details: details,
    submittedAt: new Date().toLocaleString()
  };

  let student = DATA.students.find(s => s.id === currentUser.id);
  if(student){
    student.points = (student.points || 0) + score;
    currentUser.points = student.points;
  }

  await saveData();
  showToast(`${score}점을 획득했습니다!`);
  renderStudent();
}

function studentTab(tab, el){
  document.querySelectorAll('#studentMain .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#studentMain .panel').forEach(p => p.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById(`s-${tab}`).classList.add('active');
  if(tab === 'vocab') renderStudentVocab();
}

function adminTab(tab, el){
  document.querySelectorAll('#adminMain .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#adminMain .panel').forEach(p => p.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById(`a-${tab}`).classList.add('active');
  if(tab === 'vocab') renderAdminVocab();
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(t){
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
}

function renderStudent(){
  document.getElementById('studentPoints').innerText = currentUser.points || 0;
  renderStudentVocab();
}

function renderAdmin(){
  renderAdminVocab();
}
</script>
</body>
</html>
