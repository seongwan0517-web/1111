<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitamin - 포인트 상점 & 경매 시스템</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0d0d14;
  --surface:#171722;
  --surface2:#202032;
  --border:rgba(255,255,255,.08);

  --text:#f4f4ff;
  --text2:#9a9ab5;
  --text3:#66667e;

  --accent:#6c5fff;
  --accent2:#a89cff;

  --green:#2dd4a0;
  --red:#ff6b6b;
  --amber:#ffb84d;

  --r:14px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Pretendard',sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{
  font-family:inherit;
}

.app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:620px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

/* LOGIN */

.login{
  padding:40px 30px;
}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logo h1{
  font-size:30px;
  color:var(--accent2);
}

.logo p{
  color:var(--text2);
  margin-top:6px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--text2);
  margin-bottom:6px;
}

.field input{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  padding:13px;
  border-radius:10px;
}

.btn{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700;
}

.btn-primary{
  background:var(--accent);
  color:white;
}

.btn-danger{
  background:rgba(255,107,107,.12);
  color:var(--red);
}

.btn-green{
  background:rgba(45,212,160,.12);
  color:var(--green);
}

.btn-full{
  width:100%;
}

.err{
  display:none;
  margin-bottom:12px;
  color:var(--red);
  font-size:13px;
}

/* MAIN */

.main{
  display:none;
}

.top{
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  text-align:center;
  padding:14px;
  cursor:pointer;
  color:var(--text3);
}

.tab.active{
  color:var(--accent2);
  border-bottom:2px solid var(--accent);
}

.panel{
  display:none;
  padding:20px;
}

.panel.active{
  display:block;
}

.banner{
  background:var(--surface2);
  border-radius:18px;
  padding:30px;
  text-align:center;
  margin-bottom:20px;
}

.point{
  font-size:52px;
  color:var(--accent2);
  font-weight:800;
}

.shop-item,
.student-card,
.order-card{
  background:var(--surface2);
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
}

.flex{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small{
  font-size:12px;
  color:var(--text3);
}

.history{
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.auction{
  background:linear-gradient(135deg,#262646,#181826);
  border:1px solid rgba(108,95,255,.3);
  border-radius:20px;
  padding:24px;
  text-align:center;
}

.auction h2{
  margin-bottom:10px;
}

.bid{
  font-size:38px;
  color:var(--green);
  font-weight:800;
  margin:18px 0;
}

input.bid-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  padding:12px;
  color:white;
  border-radius:10px;
  margin-bottom:10px;
}

.admin-section{
  background:var(--surface2);
  padding:16px;
  border-radius:14px;
  margin-bottom:16px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

</style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->

  <div class="card" id="loginCard">

    <div class="login">

      <div class="logo">
        <h1>Vitamin</h1>
        <p>용유중학교 포인트 시스템</p>
      </div>

      <div class="field">
        <label>아이디</label>
        <input type="text" id="loginId">
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPw">
      </div>

      <div class="err" id="loginErr">
        아이디 또는 비밀번호 오류
      </div>

      <button class="btn btn-primary btn-full" onclick="login()">
        로그인
      </button>

    </div>

  </div>

  <!-- STUDENT -->

  <div class="card main" id="studentMain">

    <div class="top">
      <div id="studentName"></div>
      <button class="btn btn-danger" onclick="logout()">로그아웃</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="studentTab('home',this)">홈</div>
      <div class="tab" onclick="studentTab('shop',this)">상점</div>
      <div class="tab" onclick="studentTab('auction',this)">경매</div>
      <div class="tab" onclick="studentTab('history',this)">내역</div>
    </div>

    <!-- HOME -->

    <div class="panel active" id="s-home">

      <div class="banner">
        <div class="small">보유 포인트</div>
        <div class="point" id="studentPoints">0</div>
      </div>

    </div>

    <!-- SHOP -->

    <div class="panel" id="s-shop">
      <div id="shopList"></div>
    </div>

    <!-- AUCTION -->

    <div class="panel" id="s-auction">
      <div id="studentAuction"></div>
    </div>

    <!-- HISTORY -->

    <div class="panel" id="s-history">
      <div id="studentHistory"></div>
    </div>

  </div>

  <!-- ADMIN -->

  <div class="card main" id="adminMain">

    <div class="top">
      <div>관리자 모드</div>
      <button class="btn btn-danger" onclick="logout()">로그아웃</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="adminTab('students',this)">학생</div>
      <div class="tab" onclick="adminTab('shop',this)">상점</div>
      <div class="tab" onclick="adminTab('auction',this)">경매</div>
      <div class="tab" onclick="adminTab('orders',this)">주문</div>
    </div>

    <!-- STUDENTS -->

    <div class="panel active" id="a-students">

      <div class="admin-section">

        <div class="small" style="margin-bottom:10px">
          포인트 지급
        </div>

        <div class="field">
          <select id="giveStudent"
            style="width:100%;padding:12px;border-radius:10px;background:var(--surface);color:white;border:1px solid var(--border)">
          </select>
        </div>

        <div class="field">
          <input type="number" id="givePoint" placeholder="포인트">
        </div>

        <div class="field">
          <input type="text" id="giveReason" placeholder="사유">
        </div>

        <button class="btn btn-primary btn-full" onclick="givePoint()">
          지급하기
        </button>

      </div>

      <div id="studentList"></div>

      <hr style="margin:20px 0;border-color:var(--border)">

      <div class="admin-section">

        <div class="small" style="margin-bottom:10px">
          학생 포인트 지급 내역
        </div>

        <select id="historyStudent"
          onchange="renderPointHistory()"
          style="width:100%;padding:12px;border-radius:10px;background:var(--surface);color:white;border:1px solid var(--border);margin-bottom:12px">
        </select>

        <div id="pointHistory"></div>

      </div>

    </div>

    <!-- SHOP -->

    <div class="panel" id="a-shop">

      <div class="admin-section">

        <div class="field">
          <input type="text" id="itemName" placeholder="상품명">
        </div>

        <div class="field">
          <input type="number" id="itemPrice" placeholder="가격">
        </div>

        <button class="btn btn-primary btn-full" onclick="addItem()">
          상품 추가
        </button>

      </div>

      <div id="adminShopList"></div>

    </div>

    <!-- AUCTION -->

    <div class="panel" id="a-auction">

      <div id="adminAuction"></div>

    </div>

    <!-- ORDERS -->

    <div class="panel" id="a-orders">
      <div id="orderList"></div>
    </div>

  </div>

</div>

<script>

const FIREBASE_URL =
"https://point-7419d-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";

let DATA = {
  students:[],
  items:[],
  orders:[],
  auction:{
    active:false,
    itemName:'',
    bids:{},
    winner:null
  }
};

let currentUser = null;

/* DATABASE */

async function dbLoad(){

  const res = await fetch(FIREBASE_URL);
  const json = await res.json();

  if(json){
    DATA = json;
  }

  if(!DATA.auction){
    DATA.auction = {
      active:false,
      itemName:'',
      bids:{},
      winner:null
    };
  }

}

async function dbSave(){

  await fetch(FIREBASE_URL,{
    method:'PUT',
    body:JSON.stringify(DATA)
  });

}

/* LOGIN */

async function login(){

  await dbLoad();

  const id = loginId.value.trim();
  const pw = loginPw.value.trim();

  if(id === 'admin' && pw === 'admin1234'){

    currentUser = {
      role:'admin'
    };

    loginCard.style.display='none';
    adminMain.style.display='block';

    renderAdmin();

    return;
  }

  const s = DATA.students.find(x=>x.id===id && x.pw===pw);

  if(!s){
    loginErr.style.display='block';
    return;
  }

  currentUser = {
    role:'student',
    data:s
  };

  loginCard.style.display='none';
  studentMain.style.display='block';

  renderStudent();

}

function logout(){
  location.reload();
}

/* STUDENT */

function renderStudent(){

  const s = DATA.students.find(
    x=>x.id===currentUser.data.id
  );

  studentName.innerText = s.name;
  studentPoints.innerText = s.points;

  renderShop();
  renderStudentHistory();
  renderStudentAuction();

}

function renderShop(){

  const s = DATA.students.find(
    x=>x.id===currentUser.data.id
  );

  shopList.innerHTML = DATA.items.map(i=>`

    <div class="shop-item flex">

      <div>
        <div>${i.name}</div>
        <div class="small">${i.price}P</div>
      </div>

      <button class="btn btn-primary"
        ${s.points < i.price ? 'disabled':''}
        onclick="buyItem(${i.id})">

        구매

      </button>

    </div>

  `).join('');

}

async function buyItem(id){

  const item = DATA.items.find(x=>x.id===id);

  const s = DATA.students.find(
    x=>x.id===currentUser.data.id
  );

  if(s.points < item.price){
    return;
  }

  s.points -= item.price;

  if(!s.history){
    s.history = [];
  }

  s.history.push({
    label:'상품 구매 - '+item.name,
    points:-item.price,
    date:new Date().toLocaleString()
  });

  DATA.orders.unshift({
    id:Date.now(),
    studentName:s.name,
    itemName:item.name
  });

  await dbSave();

  renderStudent();

}

function renderStudentHistory(){

  const s = DATA.students.find(
    x=>x.id===currentUser.data.id
  );

  studentHistory.innerHTML = (s.history || [])
  .slice()
  .reverse()
  .map(h=>`

    <div class="history flex">

      <div>
        <div>${h.label}</div>
        <div class="small">${h.date}</div>
      </div>

      <div class="${h.points > 0 ? 'green':'red'}">
        ${h.points}
      </div>

    </div>

  `).join('');

}

/* AUCTION */

function renderStudentAuction(){

  const auc = DATA.auction;

  if(!auc.active && !auc.winner){

    studentAuction.innerHTML =
    `<div class="small">진행 중인 경매가 없습니다.</div>`;

    return;
  }

  const bids = Object.values(auc.bids || {})
    .map(b=>b.amount);

  const highBid =
    bids.length ? Math.max(...bids) : 0;

  const s = DATA.students.find(
    x=>x.id===currentUser.data.id
  );

  const myBid =
    auc.bids[s.id]
      ? auc.bids[s.id].amount
      : 0;

  if(auc.active){

    studentAuction.innerHTML = `

      <div class="auction">

        <h2>${auc.itemName}</h2>

        <div>현재 최고 입찰</div>

        <div class="bid">
          ${highBid}P
        </div>

        <div style="margin-bottom:15px">
          내 입찰액 : ${myBid}P
        </div>

        <input type="number"
          class="bid-input"
          id="bidAmount"
          placeholder="추가 입찰 포인트">

        <button class="btn btn-primary btn-full"
          onclick="placeBid()">

          입찰하기

        </button>

      </div>

    `;

  }else{

    studentAuction.innerHTML = `

      <div class="auction">

        <h2>경매 종료</h2>

        <div class="bid">
          ${auc.winner
            ? auc.winner.studentName
            : '없음'}
        </div>

      </div>

    `;

  }

}

async function placeBid(){

  await dbLoad();

  const amt =
    parseInt(
      document.getElementById('bidAmount').value
    );

  const s = DATA.students.find(
    x=>x.id===currentUser.data.id
  );

  if(!amt || amt <= 0){
    return;
  }

  if(s.points < amt){
    alert('포인트 부족');
    return;
  }

  s.points -= amt;

  if(!s.history){
    s.history=[];
  }

  s.history.push({
    label:'경매 입찰',
    points:-amt,
    date:new Date().toLocaleString()
  });

  if(!DATA.auction.bids[s.id]){

    DATA.auction.bids[s.id] = {
      studentName:s.name,
      amount:amt
    };

  }else{

    DATA.auction.bids[s.id].amount += amt;

  }

  await dbSave();

  renderStudent();

}

/* ADMIN */

function renderAdmin(){

  renderStudents();
  renderAdminShop();
  renderAdminAuction();
  renderOrders();

}

function renderStudents(){

  studentList.innerHTML =
  DATA.students.map(s=>`

    <div class="student-card flex">

      <div>
        <div>${s.name}</div>
        <div class="small">${s.id}</div>
      </div>

      <div class="green">
        ${s.points}P
      </div>

    </div>

  `).join('');

  giveStudent.innerHTML =
  DATA.students.map(s=>`
    <option value="${s.id}">
      ${s.name}
    </option>
  `).join('');

  historyStudent.innerHTML =
  DATA.students.map(s=>`
    <option value="${s.id}">
      ${s.name}
    </option>
  `).join('');

  renderPointHistory();

}

async function givePoint(){

  const sid = giveStudent.value;

  const amt =
    parseInt(givePoint.value);

  const reason =
    giveReason.value || '관리자 지급';

  const s =
    DATA.students.find(x=>x.id===sid);

  s.points += amt;

  if(!s.history){
    s.history=[];
  }

  s.history.push({
    label:reason,
    points:amt,
    date:new Date().toLocaleString()
  });

  await dbSave();

  renderAdmin();

}

function renderPointHistory(){

  const sid = historyStudent.value;

  const s =
    DATA.students.find(x=>x.id===sid);

  if(!s || !s.history){

    pointHistory.innerHTML =
    '<div class="small">내역 없음</div>';

    return;
  }

  pointHistory.innerHTML =
  s.history.slice().reverse().map(h=>`

    <div class="history flex">

      <div>
        <div>${h.label}</div>
        <div class="small">${h.date}</div>
      </div>

      <div class="${h.points > 0 ? 'green':'red'}">
        ${h.points}
      </div>

    </div>

  `).join('');

}

/* ADMIN SHOP */

async function addItem(){

  const name = itemName.value;
  const price = parseInt(itemPrice.value);

  DATA.items.push({
    id:Date.now(),
    name,
    price
  });

  await dbSave();

  renderAdmin();

}

function renderAdminShop(){

  adminShopList.innerHTML =
  DATA.items.map(i=>`

    <div class="shop-item flex">

      <div>
        ${i.name}
      </div>

      <div>
        ${i.price}P
      </div>

    </div>

  `).join('');

}

/* ADMIN AUCTION */

function renderAdminAuction(){

  const auc = DATA.auction;

  if(!auc.active){

    adminAuction.innerHTML = `

      <div class="admin-section">

        <div class="field">
          <input type="text"
            id="auctionItem"
            placeholder="경매 상품명">
        </div>

        <button class="btn btn-primary btn-full"
          onclick="startAuction()">

          경매 시작

        </button>

      </div>

    `;

    if(auc.winner){

      adminAuction.innerHTML += `

        <div class="auction">

          <h2>최종 낙찰</h2>

          <div class="bid">
            ${auc.winner.studentName}
          </div>

          <div>
            ${auc.winner.amount}P
          </div>

        </div>

      `;

    }

    return;
  }

  const sorted =
    Object.entries(auc.bids)
    .map(([id,data])=>({
      id,
      ...data
    }))
    .sort((a,b)=>b.amount-a.amount);

  adminAuction.innerHTML = `

    <div class="auction">

      <h2>${auc.itemName}</h2>

      <button class="btn btn-danger btn-full"
        onclick="endAuction()">

        경매 종료

      </button>

    </div>

    <table class="table">

      <thead>
        <tr>
          <th>순위</th>
          <th>학생</th>
          <th>입찰</th>
        </tr>
      </thead>

      <tbody>

        ${sorted.map((b,i)=>`

          <tr>

            <td>${i+1}</td>

            <td>${b.studentName}</td>

            <td>${b.amount}P</td>

          </tr>

        `).join('')}

      </tbody>

    </table>

  `;

}

async function startAuction(){

  const item =
    document.getElementById('auctionItem').value;

  DATA.auction = {
    active:true,
    itemName:item,
    bids:{},
    winner:null
  };

  await dbSave();

  renderAdminAuction();

}

async function endAuction(){

  const bids =
    Object.entries(DATA.auction.bids)
    .map(([id,data])=>({
      studentId:id,
      studentName:data.studentName,
      amount:data.amount
    }))
    .sort((a,b)=>b.amount-a.amount);

  DATA.auction.active = false;

  DATA.auction.winner =
    bids[0] || null;

  await dbSave();

  renderAdminAuction();

}

/* ORDERS */

function renderOrders(){

  orderList.innerHTML =
  DATA.orders.map(o=>`

    <div class="order-card">

      <div>${o.studentName}</div>

      <div class="small">
        ${o.itemName}
      </div>

    </div>

  `).join('');

}

/* TABS */

function studentTab(id,el){

  document.querySelectorAll('#studentMain .tab')
  .forEach(t=>t.classList.remove('active'));

  document.querySelectorAll('#studentMain .panel')
  .forEach(p=>p.classList.remove('active'));

  el.classList.add('active');

  document.getElementById('s-'+id)
  .classList.add('active');

}

function adminTab(id,el){

  document.querySelectorAll('#adminMain .tab')
  .forEach(t=>t.classList.remove('active'));

  document.querySelectorAll('#adminMain .panel')
  .forEach(p=>p.classList.remove('active'));

  el.classList.add('active');

  document.getElementById('a-'+id)
  .classList.add('active');

}

</script>

</body>
</html>
