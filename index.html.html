<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용유중학교 Vitamin - 경매 & 포인트 관리</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b12;
  --surface:#13131f;
  --surface2:#1b1b2a;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.14);

  --text:#f5f5ff;
  --text2:#a0a0b8;
  --text3:#666680;

  --accent:#6c5fff;
  --accent2:#a394ff;
  --accent-bg:rgba(108,95,255,.12);
  --accent-border:rgba(108,95,255,.28);

  --green:#29d391;
  --green-bg:rgba(41,211,145,.12);

  --red:#ff6b6b;
  --red-bg:rgba(255,107,107,.12);

  --amber:#ffb84d;

  --r:12px;
  --r-lg:18px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Pretendard',sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--r-lg);
  overflow:hidden;
}

/* LOGIN */
.login-wrap{
  width:100%;
  max-width:400px;
}

.logo-area{
  padding:36px 24px 24px;
  text-align:center;
}

.logo-icon{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  border-radius:20px;
  background:var(--accent-bg);
  border:1px solid var(--accent-border);

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--accent2);
  font-size:30px;
}

.logo-area h1{
  font-size:26px;
  margin-bottom:6px;
}

.logo-area .sub{
  color:var(--text2);
  font-size:13px;
}

.login-form{
  padding:0 24px 28px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  color:var(--text2);
}

.field input,
select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border2);
  background:#0f0f18;
  color:var(--text);
  outline:none;
}

.err-msg{
  display:none;
  margin-bottom:12px;
  padding:10px;
  border-radius:10px;
  background:var(--red-bg);
  color:var(--red);
  font-size:12px;
}

/* BUTTON */
.btn{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:10px 16px;
  font-weight:600;
  font-family:inherit;
}

.btn-primary{
  background:var(--accent);
  color:white;
}

.btn-secondary{
  background:#232338;
  color:var(--text2);
}

.btn-danger{
  background:var(--red-bg);
  color:var(--red);
}

.btn-green{
  background:var(--green-bg);
  color:var(--green);
}

.btn-full{
  width:100%;
}

.btn-sm{
  padding:7px 12px;
  font-size:12px;
}

/* MAIN */
.main-wrap{
  width:100%;
  max-width:680px;
  display:none;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--accent-bg);
  color:var(--accent2);

  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:700;
}

.logout-btn{
  background:#232338;
  color:var(--text2);
  border:none;
  border-radius:20px;
  padding:7px 12px;
  cursor:pointer;
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  text-align:center;
  padding:12px;
  cursor:pointer;
  color:var(--text3);
}

.tab.active{
  color:var(--accent2);
  border-bottom:2px solid var(--accent);
}

.panel{
  display:none;
  padding:20px;
}

.panel.active{
  display:block;
}

.scroll{
  max-height:500px;
  overflow-y:auto;
}

/* POINT */
.point-banner{
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:18px;
  padding:28px;
  text-align:center;
}

.point-value{
  font-size:52px;
  font-weight:800;
  color:var(--accent2);
}

/* SHOP */
.shop-item{
  background:var(--surface2);
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* ADMIN */
.admin-section{
  background:var(--surface2);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

/* TABLE */
.admin-table{
  width:100%;
  border-collapse:collapse;
}

.admin-table th,
.admin-table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.winner-row{
  background:rgba(41,211,145,.1);
}

/* TOAST */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#202030;
  border:1px solid var(--border2);
  padding:12px 18px;
  border-radius:30px;
  opacity:0;
  transition:.2s;
}

.toast.show{
  opacity:1;
}

/* MODAL */
.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-wrap.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:var(--surface);
  border-radius:20px;
  border:1px solid var(--border2);
  padding:24px;
}

.modal-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:16px;
}

.modal-btns{
  margin-top:18px;
  display:flex;
  gap:8px;
  justify-content:flex-end;
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">

    <div class="card">

      <div class="logo-area">
        <div class="logo-icon">V</div>
        <h1>Vitamin</h1>
        <div class="sub">용유중학교 포인트 상점</div>
      </div>

      <div class="login-form">

        <div class="field">
          <label>아이디</label>
          <input type="text" id="loginId">
        </div>

        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="loginPw">
        </div>

        <div id="loginErr" class="err-msg">
          로그인 실패
        </div>

        <button class="btn btn-primary btn-full" onclick="doLogin()">
          로그인
        </button>

      </div>
    </div>
  </div>

  <!-- STUDENT -->
  <div class="main-wrap card" id="studentWrap">

    <div class="top-bar">

      <div class="top-left">
        <div class="avatar" id="sAvatar"></div>
        <div id="sName"></div>
      </div>

      <button class="logout-btn" onclick="logout()">
        로그아웃
      </button>

    </div>

    <div class="tabs">
      <div class="tab active" onclick="sTab('home',this)">홈</div>
      <div class="tab" onclick="sTab('shop',this)">상점</div>
      <div class="tab" onclick="sTab('history',this)">내역</div>
    </div>

    <!-- HOME -->
    <div class="panel active" id="s-home">

      <div class="point-banner">
        <div style="font-size:12px; color:var(--text2); margin-bottom:10px;">
          보유 포인트
        </div>

        <div>
          <span class="point-value" id="sPoints">0</span>
          <span style="font-size:20px;">P</span>
        </div>
      </div>

    </div>

    <!-- SHOP -->
    <div class="panel" id="s-shop">
      <div class="scroll" id="shopList"></div>
    </div>

    <!-- HISTORY -->
    <div class="panel" id="s-history">
      <div class="scroll" id="sHistList"></div>
    </div>

  </div>

  <!-- ADMIN -->
  <div class="main-wrap card" id="adminWrap">

    <div class="top-bar">

      <div class="top-left">
        <div class="avatar" style="background:rgba(255,184,77,.15); color:var(--amber);">
          A
        </div>

        <div>관리자</div>
      </div>

      <button class="logout-btn" onclick="logout()">
        로그아웃
      </button>

    </div>

    <div class="tabs">
      <div class="tab active" onclick="aTab('students',this)">학생</div>
      <div class="tab" onclick="aTab('shop',this)">상점</div>
      <div class="tab" onclick="aTab('orders',this)">주문</div>
    </div>

    <!-- STUDENTS -->
    <div class="panel active" id="a-students">

      <div class="admin-section">

        <div style="margin-bottom:12px; font-weight:700;">
          포인트 지급
        </div>

        <div style="display:flex; gap:8px; margin-bottom:8px;">

          <select id="giveStudent"></select>

          <input type="number" id="giveAmt" placeholder="포인트">

          <button class="btn btn-primary" onclick="givePoints()">
            지급
          </button>

        </div>

        <input
          type="text"
          id="giveReason"
          placeholder="사유 입력"
        >

      </div>

      <div id="adminStudentList"></div>
      <div class="admin-section">
  <div style="font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; margin-bottom:12px;">
    학생 포인트 지급 내역
  </div>

  <select id="historyStudent"
    onchange="renderPointHistory()"
    style="width:100%; background:var(--bg); color:var(--text);
    border:1px solid var(--border2); padding:10px;
    border-radius:var(--r-sm); margin-bottom:12px;">

  </select>

  <div id="pointHistoryList"></div>
</div>

      <button
        class="btn btn-green btn-full"
        style="margin-top:12px;"
        onclick="openAddStudentModal()"
      >
        + 학생 추가
      </button>

    </div>

    <!-- SHOP -->
    <div class="panel" id="a-shop">

      <div class="scroll" id="adminShopList"></div>

      <button
        class="btn btn-primary btn-full"
        style="margin-top:12px;"
        onclick="openAddItemModal()"
      >
        + 상품 추가
      </button>

    </div>

    <!-- ORDERS -->
    <div class="panel" id="a-orders">

      <div class="scroll" id="adminOrders"></div>

    </div>

  </div>

</div>

<!-- MODAL -->
<div class="modal-wrap" id="modalWrap">

  <div class="modal-box">

    <div class="modal-title" id="modalTitle"></div>

    <div id="modalContent"></div>

    <div class="modal-btns" id="modalBtns"></div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE_URL =
"https://point-7419d-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";

let DATA = {
  students:[],
  items:[],
  orders:[]
};

let currentUser = null;

/* DB LOAD */
async function dbLoad(){

  try{

    const res = await fetch(FIREBASE_URL);
    const json = await res.json();

    if(json){
      DATA = json;
    }

  }catch(e){
    console.log(e);
  }
}

/* DB SAVE */
async function dbSave(){

  await fetch(FIREBASE_URL,{
    method:'PUT',
    body:JSON.stringify(DATA)
  });

}

/* LOGIN */
async function doLogin(){

  const id =
    document.getElementById('loginId').value.trim();

  const pw =
    document.getElementById('loginPw').value.trim();

  await dbLoad();

  if(id === 'admin' && pw === 'admin1234'){

    currentUser = { role:'admin' };

    showUI('adminWrap');

    renderAdmin();

    return;
  }

  const s =
    DATA.students.find(x =>
      x.id === id &&
      x.pw === pw
    );

  if(s){

    currentUser = {
      role:'student',
      data:s
    };

    showUI('studentWrap');

    renderStudent();

  }else{
    document.getElementById('loginErr').style.display='block';
  }
}

/* UI */
function showUI(id){

  document.getElementById('loginWrap').style.display='none';

  document.getElementById(id).style.display='block';

}

function logout(){
  location.reload();
}

/* STUDENT */
function renderStudent(){

  const s =
    DATA.students.find(x =>
      x.id === currentUser.data.id
    );

  document.getElementById('sName').textContent =
    s.name;

  document.getElementById('sAvatar').textContent =
    s.name[0];

  document.getElementById('sPoints').textContent =
    Number(s.points).toLocaleString();

  renderShop();

  renderStudentHistory(s);
}

/* SHOP */
function renderShop(){

  const list =
    document.getElementById('shopList');

  const s =
    DATA.students.find(x =>
      x.id === currentUser.data.id
    );

  list.innerHTML =
    DATA.items.map(i => `
      <div class="shop-item">

        <div>
          <div style="font-weight:700;">
            ${i.icon} ${i.name}
          </div>

          <div style="
            font-size:12px;
            color:var(--accent2);
            margin-top:4px;
          ">
            ${i.price}P
          </div>
        </div>

        <button
          class="btn btn-primary btn-sm"
          ${s.points < i.price ? 'disabled' : ''}
          onclick="buyItem(${i.id})"
        >
          구매
        </button>

      </div>
    `).join('');

}

/* BUY */
async function buyItem(id){

  const item =
    DATA.items.find(x => x.id === id);

  const s =
    DATA.students.find(x =>
      x.id === currentUser.data.id
    );

  if(s.points < item.price){
    return;
  }

  s.points -= item.price;

  if(!s.history){
    s.history = [];
  }

  s.history.push({
    label:`상품 구매 : ${item.name}`,
    points:-item.price,
    date:new Date().toLocaleString()
  });

  DATA.orders.unshift({
    id:Date.now(),
    studentName:s.name,
    itemName:item.name,
    date:new Date().toLocaleString()
  });

  await dbSave();

  renderStudent();

  renderAdminOrders();

  toast("구매 완료");

}

/* HISTORY */
function renderStudentHistory(s){

  const list =
    document.getElementById('sHistList');

  const hist =
    (s.history || []).slice().reverse();

  if(hist.length === 0){

    list.innerHTML =
      `<div style="color:var(--text3)">
        내역이 없습니다.
      </div>`;

    return;
  }

  list.innerHTML =
    hist.map(h => `
      <div style="
        padding:12px;
        border-bottom:1px solid var(--border);

        display:flex;
        justify-content:space-between;
      ">

        <div>
          <div style="font-weight:600;">
            ${h.label}
          </div>

          <div style="
            font-size:11px;
            color:var(--text3);
            margin-top:4px;
          ">
            ${h.date}
          </div>
        </div>

        <div style="
          font-weight:700;
          color:${h.points > 0 ? 'var(--green)' : 'var(--red)'};
        ">
          ${h.points > 0 ? '+' : ''}
          ${h.points}P
        </div>

      </div>
    `).join('');

}

/* ADMIN */
function renderAdmin(){

  renderAdminStudents();

  renderAdminShop();

  renderAdminOrders();

}

/* STUDENTS */
function renderAdminStudents(){

  const list =
    document.getElementById('adminStudentList');

  list.innerHTML =
    DATA.students.map(s => `

      <div style="
        background:var(--surface2);
        padding:14px;
        border-radius:12px;
        margin-bottom:10px;
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
        ">

          <div>

            <div style="font-weight:700;">
              ${s.name}
            </div>

            <div style="
              font-size:12px;
              color:var(--text3);
              margin-top:4px;
            ">
              ${s.id}
            </div>

          </div>

          <div style="
            display:flex;
            align-items:center;
            gap:8px;
          ">

            <div style="
              font-weight:700;
              color:var(--accent2);
            ">
              ${Number(s.points).toLocaleString()}P
            </div>

            <button
              class="btn btn-secondary btn-sm"
              onclick="viewStudentHistory('${s.id}')"
            >
              내역
            </button>

            <button
              class="btn btn-danger btn-sm"
              onclick="deleteStudent('${s.id}')"
            >
              삭제
            </button>

          </div>

        </div>

      </div>

    `).join('');

  document.getElementById('giveStudent').innerHTML =
    DATA.students.map(s =>
      `<option value="${s.id}">
        ${s.name} (${s.id})
      </option>`
    ).join('');

}

/* HISTORY VIEW */
function viewStudentHistory(studentId){

  const s =
    DATA.students.find(x =>
      x.id === studentId
    );

  const history =
    (s.history || []).slice().reverse();

  let html = '';

  if(history.length === 0){

    html =
      `<div style="
        text-align:center;
        color:var(--text3);
        padding:30px;
      ">
        내역이 없습니다.
      </div>`;

  }else{

    html =
      history.map(h => `
        <div style="
          padding:12px;
          border-bottom:1px solid var(--border);

          display:flex;
          justify-content:space-between;
          gap:10px;
        ">

          <div>

            <div style="
              font-weight:700;
              margin-bottom:4px;
            ">
              ${h.label}
            </div>

            <div style="
              font-size:11px;
              color:var(--text3);
            ">
              ${h.date}
            </div>

          </div>

          <div style="
            font-weight:700;
            color:${h.points > 0 ? 'var(--green)' : 'var(--red)'};
          ">
            ${h.points > 0 ? '+' : ''}
            ${h.points}P
          </div>

        </div>
      `).join('');
  }

  openModal(
    `${s.name} 포인트 내역`,
    `
      <div style="
        max-height:400px;
        overflow-y:auto;
      ">
        ${html}
      </div>
    `,
    [
      {
        label:'닫기',
        cls:'btn-secondary',
        fn:closeModal
      }
    ]
  );
}

/* GIVE POINTS */
async function givePoints(){

  const sid =
    document.getElementById('giveStudent').value;

  const amt =
    parseInt(document.getElementById('giveAmt').value);

  const reason =
    document.getElementById('giveReason').value.trim()
    || '관리자 지급';

  const s =
    DATA.students.find(x =>
      x.id === sid
    );

  if(!s || isNaN(amt)){
    return;
  }

  s.points =
    (Number(s.points) || 0) + amt;

  if(!s.history){
    s.history = [];
  }

  s.history.push({
    label:reason,
    points:amt,
    date:new Date().toLocaleString()
  });

  await dbSave();

  renderAdmin();

  toast(`${s.name} ${amt}P 지급 완료`);

  document.getElementById('giveAmt').value='';
  document.getElementById('giveReason').value='';

}

/* DELETE STUDENT */
async function deleteStudent(id){

  if(!confirm('삭제하시겠습니까?')){
    return;
  }

  DATA.students =
    DATA.students.filter(s =>
      s.id !== id
    );

  await dbSave();

  renderAdmin();

}

/* SHOP ADMIN */
function renderAdminShop(){

  const list =
    document.getElementById('adminShopList');

  list.innerHTML =
    DATA.items.map(i => `
      <div class="shop-item">

        <div>
          ${i.icon} ${i.name}
          <div style="
            color:var(--accent2);
            margin-top:4px;
            font-size:12px;
          ">
            ${i.price}P
          </div>
        </div>

        <button
          class="btn btn-danger btn-sm"
          onclick="deleteItem(${i.id})"
        >
          삭제
        </button>

      </div>
    `).join('');

}

/* DELETE ITEM */
async function deleteItem(id){

  DATA.items =
    DATA.items.filter(i =>
      i.id !== id
    );

  await dbSave();

  renderAdminShop();

}

/* ORDER */
function renderAdminOrders(){

  const list =
    document.getElementById('adminOrders');

  list.innerHTML =
    DATA.orders.map(o => `
      <div class="shop-item">

        <div>

          <div style="font-weight:700;">
            ${o.studentName}
          </div>

          <div style="
            margin-top:4px;
            color:var(--accent2);
          ">
            ${o.itemName}
          </div>

        </div>

      </div>
    `).join('');

}

/* MODAL */
function openModal(title,content,btns){

  document.getElementById('modalTitle').textContent =
    title;

  document.getElementById('modalContent').innerHTML =
    content;

  const area =
    document.getElementById('modalBtns');

  area.innerHTML = '';

  btns.forEach(b => {

    const btn =
      document.createElement('button');

    btn.className =
      'btn ' + b.cls;

    btn.textContent =
      b.label;

    btn.onclick =
      b.fn;

    area.appendChild(btn);

  });

  document.getElementById('modalWrap')
    .classList.add('open');

}

function closeModal(){

  document.getElementById('modalWrap')
    .classList.remove('open');

}

/* ADD STUDENT */
function openAddStudentModal(){

  openModal(
    '학생 추가',

    `
      <input
        id="asId"
        placeholder="아이디"
        style="
          width:100%;
          margin-bottom:8px;
          padding:10px;
          border-radius:10px;
          background:#111;
          border:1px solid var(--border2);
          color:white;
        "
      >

      <input
        id="asName"
        placeholder="이름"
        style="
          width:100%;
          margin-bottom:8px;
          padding:10px;
          border-radius:10px;
          background:#111;
          border:1px solid var(--border2);
          color:white;
        "
      >

      <input
        id="asPw"
        placeholder="비밀번호"
        style="
          width:100%;
          padding:10px;
          border-radius:10px;
          background:#111;
          border:1px solid var(--border2);
          color:white;
        "
      >
    `,

    [
      {
        label:'등록',
        cls:'btn-primary',

        fn:async()=>{

          const id =
            document.getElementById('asId').value;

          const name =
            document.getElementById('asName').value;

          const pw =
            document.getElementById('asPw').value;

          if(!id || !name || !pw){
            return;
          }

          DATA.students.push({
            id,
            name,
            pw,
            points:0,
            history:[]
          });

          await dbSave();

          renderAdmin();

          closeModal();

        }
      },

      {
        label:'취소',
        cls:'btn-secondary',
        fn:closeModal
      }
    ]
  );

}

/* ADD ITEM */
function openAddItemModal(){

  openModal(
    '상품 추가',

    `
      <input
        id="aiIcon"
        placeholder="이모지"
        style="
          width:100%;
          margin-bottom:8px;
          padding:10px;
          border-radius:10px;
          background:#111;
          border:1px solid var(--border2);
          color:white;
        "
      >

      <input
        id="aiName"
        placeholder="상품명"
        style="
          width:100%;
          margin-bottom:8px;
          padding:10px;
          border-radius:10px;
          background:#111;
          border:1px solid var(--border2);
          color:white;
        "
      >

      <input
        type="number"
        id="aiPrice"
        placeholder="가격"
        style="
          width:100%;
          padding:10px;
          border-radius:10px;
          background:#111;
          border:1px solid var(--border2);
          color:white;
        "
      >
    `,

    [
      {
        label:'추가',
        cls:'btn-primary',

        fn:async()=>{

          const icon =
            document.getElementById('aiIcon').value || '🎁';

          const name =
            document.getElementById('aiName').value;

          const price =
            parseInt(document.getElementById('aiPrice').value);

          if(!name || !price){
            return;
          }

          DATA.items.push({
            id:Date.now(),
            icon,
            name,
            price
          });

          await dbSave();

          renderAdminShop();

          closeModal();

        }
      },

      {
        label:'취소',
        cls:'btn-secondary',
        fn:closeModal
      }
    ]
  );

}

/* TAB */
function sTab(id,el){

  document
    .querySelectorAll('#studentWrap .tab')
    .forEach(x => x.classList.remove('active'));

  document
    .querySelectorAll('#studentWrap .panel')
    .forEach(x => x.classList.remove('active'));

  el.classList.add('active');

  document.getElementById('s-'+id)
    .classList.add('active');

}

function aTab(id,el){

  document
    .querySelectorAll('#adminWrap .tab')
    .forEach(x => x.classList.remove('active'));

  document
    .querySelectorAll('#adminWrap .panel')
    .forEach(x => x.classList.remove('active'));

  el.classList.add('active');

  document.getElementById('a-'+id)
    .classList.add('active');

}

/* TOAST */
function toast(msg){

  const t =
    document.getElementById('toast');

  t.textContent = msg;

  t.classList.add('show');

  setTimeout(()=>{
    t.classList.remove('show');
  },2000);

}

dbLoad();
