<script>
const FIREBASE_URL = "https://point-7419d-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";
const STEP = 10; 

// 샘플 VOCAB_DATA (기존에 사용하시던 VOCAB_DATA 객체가 있다면 이 위치에 덮어씌우시면 됩니다)
const VOCAB_DATA = {
  "day1": [["apple", "사과"], ["banana", "바나나"]],
  "day2": [["cat", "고양이"], ["dog", "개"]]
};

let DATA = { students:[], items:[], orders:[], auctions:{}, vocabTests:{}, vocabSubmissions:{} };
let currentUser = null;

// 페이지 로드 시 초기화
window.onload = function() {
  loadData();
};

async function loadData(){
  try{
    let r = await fetch(FIREBASE_URL);
    let d = await r.json();
    if(d){
      DATA = d;
      if(!DATA.students) DATA.students = [];
      if(!DATA.items) DATA.items = [];
      if(!DATA.orders) DATA.orders = [];
      if(!DATA.auctions) DATA.auctions = {};
      if(!DATA.vocabTests) DATA.vocabTests = {};
      if(!DATA.vocabSubmissions) DATA.vocabSubmissions = {};
    }
  }catch(e){
    console.error("데이터 로드 실패:", e);
  }
}

async function saveData(){
  try{
    await fetch(FIREBASE_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(DATA)
    });
  }catch(e){
    console.error("데이터 저장 실패:", e);
  }
}

// ── 로그인 & 로그아웃 ──
async function login(){
  await loadData();
  let id = document.getElementById('loginId').value.trim();
  let pw = document.getElementById('loginPw').value.trim();
  let err = document.getElementById('loginErr');
  if(err) err.style.display = 'none';

  if(id === 'admin' && pw === 'admin1234'){
    currentUser = { role:'admin', name:'관리자' };
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminMain').style.display = 'block';
    renderAdmin();
    return;
  }

  let st = DATA.students.find(s => s.id === id && s.pw === pw);
  if(st){
    currentUser = { role:'student', ...st };
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('studentMain').style.display = 'block';
    let nameElem = document.getElementById('studentName');
    if(nameElem) nameElem.innerText = `${st.name} 학생`;
    renderStudent();
    return;
  }
  if(err) err.style.display = 'block';
}

function logout(){
  currentUser = null;
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('studentMain').style.display = 'none';
  document.getElementById('adminMain').style.display = 'none';
}

// ── 교사: 단어시험 관리 ──
async function toggleVocabTest(day){
  await loadData();
  let currentStatus = DATA.vocabTests[day] || false;
  DATA.vocabTests[day] = !currentStatus;
  
  await saveData();
  showToast(DATA.vocabTests[day] ? `${day} 시험이 열렸습니다.` : `${day} 시험이 마감되었습니다.`);
  renderAdminVocab();
}

function renderAdminVocab(){
  let h = '';
  Object.keys(VOCAB_DATA).forEach(day => {
    let isOpen = DATA.vocabTests[day] || false;
    let submittedStudents = [];
    
    if(DATA.vocabSubmissions && DATA.vocabSubmissions[day]){
      Object.keys(DATA.vocabSubmissions[day]).forEach(stId => {
        let sub = DATA.vocabSubmissions[day][stId];
        let wrongWords = sub.details ? sub.details.filter(w => !w.isCorrect) : [];
        submittedStudents.push({ ...sub, wrongWords });
      });
    }

    h += `<div class="admin-auction-card" style="border:1px solid #ccc;padding:12px;margin-bottom:10px;border-radius:8px;">
      <div class="aa-header" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="aa-title" style="font-size:16px;font-weight:800">${day.toUpperCase()} (${VOCAB_DATA[day].length}단어)</div>
          <div class="small">상태: ${isOpen ? '<span style="color:green">응시 가능 (OPEN)</span>' : '<span style="color:red">마감됨 (CLOSED)</span>'}</div>
        </div>
        <button class="btn ${isOpen ? 'btn-danger' : 'btn-success'} btn-sm" onclick="toggleVocabTest('${day}')">
          ${isOpen ? '시험 닫기' : '시험 열기'}
        </button>
      </div>`;

    if(submittedStudents.length > 0){
      h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #e5e5e5">
        <div class="small" style="font-weight:700;margin-bottom:6px">학생별 오답 제출 내역</div>`;
      submittedStudents.forEach(st => {
        h += `<div style="background:#f9f9f9;padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px">
          <div style="display:flex;justify-content:space-between;">
            <strong>${st.studentName} (${st.studentId})</strong>
            <span style="color:green;font-weight:bold">${st.score}점 획득</span>
          </div>`;
        
        if(st.wrongWords.length > 0){
          h += `<div style="color:red;font-size:12px;margin-top:4px">
            틀린 단어 (${st.wrongWords.length}개): ${st.wrongWords.map(w => `${w.word}(작성: ${w.userAns || '미입력'})`).join(', ')}
          </div>`;
        } else {
          h += `<div style="color:green;font-size:12px;margin-top:4px">만점 (틀린 단어 없음)</div>`;
        }
        h += `</div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  });
  
  let target = document.getElementById('adminVocabList');
  if(target) target.innerHTML = h;
}

// ── 학생: 단어시험 및 오답노트 ──
function renderStudentVocab(){
  let h = '';
  Object.keys(VOCAB_DATA).forEach(day => {
    let isOpen = DATA.vocabTests[day] || false;
    let mySub = (DATA.vocabSubmissions && DATA.vocabSubmissions[day]) ? DATA.vocabSubmissions[day][currentUser.id] : null;

    h += `<div class="shop-item" style="border:1px solid #ccc;padding:12px;margin-bottom:10px;border-radius:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <strong style="font-size:16px">${day.toUpperCase()}</strong>
          <span class="small" style="margin-left:8px">총 ${VOCAB_DATA[day].length}문항</span>
        </div>`;

    if(mySub){
      h += `<span class="badge" style="background:#e1f5fe;color:#0288d1;padding:4px 8px;border-radius:4px;">제출완료 (${mySub.score}점)</span></div>`;
      h += `<button class="btn btn-primary btn-sm" onclick="viewMyWrongAnswers('${day}')">오답 노트 및 제출 답안 확인</button>`;
    } else if(isOpen){
      h += `<span class="badge" style="background:#e8f5e9;color:#2e7d32;padding:4px 8px;border-radius:4px;">응시 가능</span></div>`;
      h += `<button class="btn btn-success btn-sm" onclick="startQuiz('${day}')">시험 응시하기</button>`;
    } else {
      h += `<span class="badge" style="background:#ffebee;color:#c62828;padding:4px 8px;border-radius:4px;">마감됨</span></div>`;
      h += `<div class="small" style="color:red">시험이 마감되어 응시할 수 없습니다.</div>`;
    }
    h += `</div>`;
  });
  
  let target = document.getElementById('studentVocabList');
  if(target) target.innerHTML = h;
}

function viewMyWrongAnswers(day){
  let mySub = DATA.vocabSubmissions[day][currentUser.id];
  let h = `<div style="background:#f5f5f5;padding:16px;border-radius:12px;margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3>${day.toUpperCase()} 내 제출 결과</h3>
      <button class="btn btn-danger btn-sm" onclick="renderStudentVocab()">목록으로</button>
    </div>
    <div style="margin-bottom:10px"><strong>획득 점수:</strong> ${mySub.score}점</div><div>`;

  mySub.details.forEach((item, idx) => {
    h += `<div style="background:#fff;padding:10px;border-radius:8px;margin-bottom:6px;border:1px solid ${item.isCorrect ? '#a5d6a7' : '#ef9a9a'}">
      <div><strong>${idx+1}. ${item.word}</strong> (정답: ${item.correctAns})</div>
      <div class="small" style="margin-top:4px">
        내가 쓴 답: <span style="font-weight:700;color:${item.isCorrect ? 'green' : 'red'}">${item.userAns || '미입력'}</span> 
        ${item.isCorrect ? '<span style="color:green">(정답)</span>' : '<span style="color:red">(오답)</span>'}
      </div>
    </div>`;
  });
  h += `</div></div>`;
  
  let target = document.getElementById('studentVocabList');
  if(target) target.innerHTML = h;
}

function startQuiz(day){
  let words = VOCAB_DATA[day];
  let h = `<div style="background:#f5f5f5;padding:20px;border-radius:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3>${day.toUpperCase()} 단어시험</h3>
      <button class="btn btn-danger btn-sm" onclick="renderStudentVocab()">취소</button>
    </div>`;
  
  words.forEach((w, i) => {
    h += `<div style="margin-bottom:10px;">
      <label style="display:block;margin-bottom:4px;">${i+1}. ${w[0]}</label>
      <input type="text" id="q_${i}" placeholder="뜻을 입력하세요" style="width:100%;padding:8px;box-sizing:border-box;">
    </div>`;
  });

  h += `<button class="btn btn-primary" onclick="submitQuiz('${day}')" style="width:100%;padding:10px;margin-top:10px">제출하기</button></div>`;
  
  let target = document.getElementById('studentVocabList');
  if(target) target.innerHTML = h;
}

async function submitQuiz(day){
  await loadData();
  let words = VOCAB_DATA[day];
  let score = 0;
  let details = [];

  words.forEach((w, i) => {
    let inputElem = document.getElementById(`q_${i}`);
    let userAns = inputElem ? inputElem.value.trim() : '';
    let isCorrect = userAns === w[1].trim();
    if(isCorrect) score += 10;

    details.push({
      word: w[0],
      correctAns: w[1],
      userAns: userAns,
      isCorrect: isCorrect
    });
  });

  if(!DATA.vocabSubmissions) DATA.vocabSubmissions = {};
  if(!DATA.vocabSubmissions[day]) DATA.vocabSubmissions[day] = {};

  DATA.vocabSubmissions[day][currentUser.id] = {
    studentId: currentUser.id,
    studentName: currentUser.name,
    score: score,
    details: details,
    submittedAt: new Date().toLocaleString()
  };

  let student = DATA.students.find(s => s.id === currentUser.id);
  if(student){
    student.points = (student.points || 0) + score;
    currentUser.points = student.points;
    if(!student.history) student.history = [];
    student.history.unshift({
      date: new Date().toLocaleDateString(),
      amt: score,
      reason: `${day.toUpperCase()} 단어시험 (${score}점)`
    });
  }

  await saveData();
  showToast(`${score}점을 획득했습니다!`);
  renderStudent();
}

// ── UI 탭 & 렌더링 ──
function studentTab(tab, el){
  document.querySelectorAll('#studentMain .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#studentMain .panel').forEach(p => p.classList.remove('active'));
  if(el) el.classList.add('active');
  let target = document.getElementById(`s-${tab}`);
  if(target) target.classList.add('active');
  if(tab === 'vocab') renderStudentVocab();
}

function adminTab(tab, el){
  document.querySelectorAll('#adminMain .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#adminMain .panel').forEach(p => p.classList.remove('active'));
  if(el) el.classList.add('active');
  let target = document.getElementById(`a-${tab}`);
  if(target) target.classList.add('active');
  if(tab === 'vocab') renderAdminVocab();
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(t){
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  } else {
    alert(msg);
  }
}

function renderStudent(){
  let ptElem = document.getElementById('studentPoints');
  if(ptElem) ptElem.innerText = currentUser.points || 0;
  renderStudentVocab();
}

function renderAdmin(){
  renderAdminVocab();
}
</script>
