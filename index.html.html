<!DOCTYPE html>
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitamin - 포인트 상점 &amp; 경매 시스템</title>
<link href="./index_files/css2" rel="stylesheet">
<style>
:root{
  --bg:#0d0d14; --surface:#171722; --surface2:#202032; --border:rgba(255,255,255,.08);
  --text:#f4f4ff; --text2:#9a9ab5; --text3:#66667e;
  --accent:#6c5fff; --accent2:#a89cff; --green:#2dd4a0; --red:#ff6b6b; --orange:#ff9f43;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);}
button,input,select{font-family:inherit;}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(108,95,255,.18) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 90%,rgba(45,212,160,.10) 0%,transparent 60%),var(--bg);}
.card{width:100%;max-width:660px;background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;}
.login-hero{position:relative;padding:52px 40px 44px;background:linear-gradient(145deg,#1a1830,#141420);border-bottom:1px solid var(--border);overflow:hidden;text-align:center;}
.login-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(108,95,255,.22) 0%,transparent 55%),radial-gradient(circle at 75% 70%,rgba(45,212,160,.12) 0%,transparent 50%);pointer-events:none;}
.login-dots{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;}
.login-dots span{position:absolute;border-radius:50%;background:var(--accent);opacity:.18;animation:float 6s ease-in-out infinite;}
.login-dots span:nth-child(1){width:6px;height:6px;top:20%;left:10%;animation-delay:0s;}
.login-dots span:nth-child(2){width:4px;height:4px;top:60%;left:80%;animation-delay:1.5s;}
.login-dots span:nth-child(3){width:5px;height:5px;top:80%;left:25%;animation-delay:3s;}
.login-dots span:nth-child(4){width:3px;height:3px;top:30%;left:65%;animation-delay:4.5s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.logo-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(108,95,255,.15);border:1px solid rgba(108,95,255,.3);border-radius:100px;padding:6px 16px;margin-bottom:20px;font-size:12px;color:var(--accent2);letter-spacing:.08em;}
.login-hero h1{font-size:56px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#fff 20%,var(--accent2) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:10px;position:relative;}
.login-hero .tagline{color:var(--text2);font-size:14px;position:relative;}
.login-hero .tagline strong{color:var(--text);font-weight:600;}
.login-body{padding:32px 40px 36px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:13px 16px;border-radius:10px;font-size:15px;transition:border-color .2s;}
.field input:focus,.field select:focus{outline:none;border-color:rgba(108,95,255,.5);}
.field select option{background:var(--surface2);}
.btn{border:none;cursor:pointer;border-radius:10px;padding:12px 16px;font-weight:700;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#7b6cff,#5040e0);color:white;box-shadow:0 4px 24px rgba(108,95,255,.35);}
.btn-danger{background:rgba(255,107,107,.12);color:var(--red);}
.btn-success{background:rgba(45,212,160,.12);color:var(--green);}
.btn-full{width:100%;}
.btn-sm{padding:7px 12px;font-size:13px;}
.err{display:none;margin-bottom:12px;color:var(--red);font-size:13px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:8px;padding:10px 14px;}
.main{display:none;}
.top{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.tab{flex:1;text-align:center;padding:14px;cursor:pointer;color:var(--text3);font-size:14px;font-weight:600;min-width:70px;}
.tab.active{color:var(--accent2);border-bottom:2px solid var(--accent);}
.panel{display:none;padding:20px;}
.panel.active{display:block;}
.banner{background:var(--surface2);border-radius:18px;padding:30px;text-align:center;margin-bottom:20px;}
.point{font-size:52px;color:var(--accent2);font-weight:800;}
.shop-item,.student-card,.order-card{background:var(--surface2);padding:14px;border-radius:12px;margin-bottom:10px;}
.flex{display:flex;justify-content:space-between;align-items:center;}
.flex-col{display:flex;flex-direction:column;gap:6px;}
.small{font-size:12px;color:var(--text3);}
.history{padding:10px 0;border-bottom:1px solid var(--border);}
.admin-section{background:var(--surface2);padding:16px;border-radius:14px;margin-bottom:16px;}
.table{width:100%;border-collapse:collapse;}
.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;}
.table th{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.green{color:var(--green);} .red{color:var(--red);} .orange{color:var(--orange);}

.auction-card{
  background:linear-gradient(135deg,#222240,#181828);
  border:1px solid rgba(108,95,255,.25);
  border-radius:18px;
  padding:20px;
  margin-bottom:14px;
  transition:border-color .2s;
}
.auction-card:hover{border-color:rgba(108,95,255,.5);}
.auction-card .ac-title{font-size:17px;font-weight:800;margin-bottom:4px;}
.auction-card .ac-meta{font-size:12px;color:var(--text3);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;}
.auction-card .ac-meta span{display:flex;align-items:center;gap:4px;}
.ac-bid-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.ac-bid-row input{flex:1;background:var(--surface);border:1px solid var(--border);color:white;padding:10px 14px;border-radius:10px;font-size:14px;}
.ac-bid-row input:focus{outline:none;border-color:rgba(108,95,255,.5);}
.bid-display{font-size:28px;font-weight:800;color:var(--green);}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;}
.badge-active{background:rgba(45,212,160,.15);color:var(--green);border:1px solid rgba(45,212,160,.3);}
.badge-ended{background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.2);}
.badge-winner{background:rgba(255,159,67,.15);color:var(--orange);border:1px solid rgba(255,159,67,.3);}

.admin-auction-card{background:var(--surface2);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
.admin-auction-card .aa-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.admin-auction-card .aa-title{font-size:15px;font-weight:700;}

.step-group{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);}
.step-group button{background:transparent;border:none;color:var(--text2);padding:10px 16px;cursor:pointer;font-size:18px;font-weight:700;transition:background .15s;}
.step-group button:hover{background:rgba(255,255,255,.07);}
.step-group .step-val{padding:10px 18px;min-width:70px;text-align:center;font-weight:700;font-size:15px;color:var(--text);}

.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#1e1e2e;border:1px solid rgba(45,212,160,.4);
  color:var(--green);padding:14px 24px;border-radius:100px;
  font-size:15px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;z-index:9999;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{color:var(--text3);font-size:13px;padding:20px 0;text-align:center;}

.opt-btn{background:var(--surface2);color:var(--text);text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--border);font-size:14px;}
.opt-btn:hover{border-color:rgba(108,95,255,.5);}
</style>
</head>
<body>
<div class="app">

  <!-- ── 로그인 ── -->
  <div class="card" id="loginCard">
    <div class="login-hero">
      <div class="login-dots"><span></span><span></span><span></span><span></span></div>
      <div class="logo-pill">용유중학교 포인트 시스템</div>
      <h1>Vitamin</h1>
      <div class="tagline">학생 <strong>포인트</strong> 적립 · 상점 · 경매</div>
    </div>
    <div class="login-body">
      <div class="field"><label>아이디</label><input type="text" id="loginId" placeholder="아이디를 입력하세요"></div>
      <div class="field"><label>비밀번호</label><input type="password" id="loginPw" placeholder="비밀번호를 입력하세요"></div>
      <div class="err" id="loginErr">아이디 또는 비밀번호가 올바르지 않습니다.</div>
      <button class="btn btn-primary btn-full" onclick="login()">로그인</button>
    </div>
  </div>

  <!-- ── 학생 메인 ── -->
  <div class="card main" id="studentMain">
    <div class="top"><div id="studentName" style="font-weight:700"></div><button class="btn btn-danger" onclick="logout()">로그아웃</button></div>
    <div class="tabs">
      <div class="tab active" onclick="studentTab('home',this)">홈</div>
      <div class="tab" onclick="studentTab('shop',this)">상점</div>
      <div class="tab" onclick="studentTab('auction',this)">경매</div>
      <div class="tab" onclick="studentTab('vocab',this)">단어시험</div>
      <div class="tab" onclick="studentTab('history',this)">내역</div>
    </div>
    <div class="panel active" id="s-home">
      <div class="banner"><div class="small">보유 포인트</div><div class="point" id="studentPoints">0</div></div>
    </div>
    <div class="panel" id="s-shop"><div id="shopList"></div></div>
    <div class="panel" id="s-auction"><div id="studentAuctionList"></div></div>
    <div class="panel" id="s-vocab"><div id="studentVocabList"></div></div>
    <div class="panel" id="s-history"><div id="studentHistory"></div></div>
  </div>

  <!-- ── 관리자 메인 ── -->
  <div class="card main" id="adminMain">
    <div class="top"><div style="font-weight:700">관리자 모드</div><button class="btn btn-danger" onclick="logout()">로그아웃</button></div>
    <div class="tabs">
      <div class="tab active" onclick="adminTab('students',this)">학생</div>
      <div class="tab" onclick="adminTab('shop',this)">상점</div>
      <div class="tab" onclick="adminTab('auction',this)">경매</div>
      <div class="tab" onclick="adminTab('vocab',this)">단어시험</div>
      <div class="tab" onclick="adminTab('orders',this)">주문</div>
    </div>
    <div class="panel active" id="a-students">
      <div class="admin-section">
        <div class="small" style="margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text2)">학생 추가</div>
        <div class="field"><label>이름</label><input type="text" id="newName" placeholder="홍길동"></div>
        <div class="field"><label>아이디</label><input type="text" id="newId" placeholder="로그인 아이디"></div>
        <div class="field"><label>비밀번호</label><input type="text" id="newPw" placeholder="초기 비밀번호"></div>
        <button class="btn btn-primary btn-full" onclick="addStudent()">학생 추가</button>
      </div>
      <div class="admin-section">
        <div class="small" style="margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text2)">포인트 지급</div>
        <div class="field">
          <select id="giveStudent" style="background:var(--surface);color:white;border:1px solid var(--border)"></select>
        </div>
        <div class="field"><input type="number" id="giveAmt" placeholder="포인트 (음수 입력시 차감)"></div>
        <div class="field"><input type="text" id="giveReason" placeholder="사유"></div>
        <button class="btn btn-primary btn-full" onclick="givePoint()">지급하기</button>
      </div>
      <div id="studentList"></div>
      <hr style="margin:20px 0;border-color:var(--border)">
      <div class="admin-section">
        <div class="small" style="margin-bottom:10px">학생 포인트 지급 내역</div>
        <select id="historyStudent" onchange="renderPointHistory()" style="width:100%;padding:12px;border-radius:10px;background:var(--surface);color:white;border:1px solid var(--border);margin-bottom:12px"></select>
        <div id="pointHistory"></div>
      </div>
    </div>
    <div class="panel" id="a-shop">
      <div class="admin-section">
        <div class="small" style="margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text2)">상품 등록</div>
        <div class="field"><input type="text" id="itemName" placeholder="상품명"></div>
        <div class="field"><input type="number" id="itemPrice" placeholder="가격"></div>
        <button class="btn btn-primary btn-full" onclick="addItem()">상품 추가</button>
      </div>
      <div id="adminShopList"></div>
    </div>
    <div class="panel" id="a-auction">
      <div class="admin-section">
        <div class="small" style="margin-bottom:12px;font-size:13px;font-weight:700;color:var(--text2)">새 경매 시작</div>
        <div class="field"><label>경매 상품명</label><input type="text" id="auctionItem" placeholder="예) 편의점 상품권 5000원"></div>
        <div class="field"><label>최소 시작가 (P)</label><input type="number" id="auctionStart" placeholder="예) 100" min="10" step="10"></div>
        <button class="btn btn-primary btn-full" onclick="startAuction()">경매 시작</button>
      </div>
      <div id="adminAuctionList"></div>
    </div>
    <div class="panel" id="a-vocab">
      <div class="admin-section">
        <div class="small" style="margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text2)">단어시험 관리 (Day 1~30)</div>
        <div class="small">열기를 누르면 학생들이 해당 Day 시험에 응시할 수 있습니다. 1문제당 10점이 적립됩니다.</div>
      </div>
      <div id="adminVocabList"></div>
    </div>
    <div class="panel" id="a-orders"><div id="orderList"></div></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function today() { return new Date().toLocaleString('ko-KR'); }

/* ── DB ── */
async function dbLoad() {
  try {
    const res = await fetch(FIREBASE_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json) DATA = json;
  } catch(e) { alert('데이터베이스 연결 실패: ' + e.message); return false; }
  if (!DATA.students) DATA.students = [];
  if (!DATA.items)    DATA.items    = [];
  if (!DATA.orders)   DATA.orders   = [];
  if (!DATA.auctions) DATA.auctions = {};
  if (!DATA.vocabTests) DATA.vocabTests = {};
  if (DATA.auction) {
    if (DATA.auction.itemName && !DATA.auctions['legacy']) {
      DATA.auctions['legacy'] = DATA.auction;
      DATA.auctions['legacy'].id = 'legacy';
    }
    delete DATA.auction;
  }
  return true;
}

async function dbSave() {
  try {
    const res = await fetch(FIREBASE_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(DATA)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch(e) { alert('저장 실패: ' + e.message); }
}

async function login() {
  const id  = document.getElementById('loginId').value.trim();
  const pw  = document.getElementById('loginPw').value.trim();
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  const ok = await dbLoad();
  if (!ok) return;
  if (id === 'admin' && pw === 'admin1234') {
    currentUser = {role:'admin'};
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminMain').style.display = 'block';
    renderAdmin();
    return;
  }
  const s = DATA.students.find(x => x.id === id && x.pw === pw);
  if (!s) { err.style.display = 'block'; return; }
  currentUser = {role:'student', data:s};
  document.getElementById('loginCard').style.display   = 'none';
  document.getElementById('studentMain').style.display = 'block';
  renderStudent();
  startAuctionPoll();
}

function getMe()  { return DATA.students.find(x => x.id === currentUser.data.id); }

/* ── 학생 렌더 ── */
function renderStudent() {
  const s = getMe();
  document.getElementById('studentName').innerText   = s.name;
  document.getElementById('studentPoints').innerText = s.points;
  renderShop();
  renderStudentHistory();
  renderStudentAuctionList();
  renderStudentVocabList();
}

function historyRows(arr) {
  if (!arr || !arr.length) return '<div class="empty">내역이 없습니다.</div>';
  return arr.slice().reverse().map(function(h) {
    var cls  = h.points > 0 ? 'green' : 'red';
    var sign = h.points > 0 ? '+' : '';
    return '<div class="history flex"><div><div>' + h.label + '</div><div class="small">' + h.date + '</div></div><div class="' + cls + '">' + sign + h.points + 'P</div></div>';
  }).join('');
}

function renderStudentHistory() {
  document.getElementById('studentHistory').innerHTML = historyRows(getMe().history);
}

function renderShop() {
  const s  = getMe();
  const el = document.getElementById('shopList');
  if (!DATA.items.length) { el.innerHTML = '<div class="empty">등록된 상품이 없습니다.</div>'; return; }
  el.innerHTML = DATA.items.map(function(i) {
    return '<div class="shop-item flex"><div><div>' + i.name + '</div><div class="small">' + i.price + 'P</div></div>' +
      '<button class="btn btn-primary btn-sm" ' + (s.points < i.price ? 'disabled' : '') + ' onclick="buyItem(' + i.id + ')">구매</button></div>';
  }).join('');
}

async function buyItem(itemId) {
  const item = DATA.items.find(x => x.id === itemId);
  const s    = getMe();
  if (!item || s.points < item.price) return;
  s.points -= item.price;
  if (!s.history) s.history = [];
  s.history.push({label:'상품 구매 - ' + item.name, points:-item.price, date:today()});
  DATA.orders.unshift({id:Date.now(), studentName:s.name, itemName:item.name});
  await dbSave();
  showToast('🛍️ ' + item.name + ' 구매 완료!');
  renderStudent();
}

/* ── 학생 경매 목록 ── */
function renderStudentAuctionList() {
  var el = document.getElementById('studentAuctionList');
  var list = Object.values(DATA.auctions || {});
  if (!list.length) { el.innerHTML = '<div class="empty">진행 중인 경매가 없습니다.</div>'; return; }
  el.innerHTML = list.map(function(auc) {
    return buildStudentAuctionCard(auc);
  }).join('');
}

function buildStudentAuctionCard(auc) {
  var s       = getMe();
  var bids    = Object.values(auc.bids || {}).map(function(b){ return b.amount; });
  var highBid = bids.length ? Math.max.apply(null, bids) : 0;
  var myEntry = auc.bids && auc.bids[String(s.id)] ? auc.bids[String(s.id)] : null;
  var myTotal = myEntry ? myEntry.amount : 0;
  var minBid  = Math.max(auc.startPrice || 10, highBid > 0 ? highBid + STEP : (auc.startPrice || 10));
  if (minBid % STEP !== 0) minBid = Math.ceil(minBid / STEP) * STEP;

  if (auc.active) {
    var isTop  = myTotal > 0 && myTotal === highBid;
    var badgeCls = isTop ? 'badge-winner' : 'badge-active';
    var badgeTxt = isTop ? '🥇 최고 입찰자' : '진행 중';
    return '<div class="auction-card" id="acard-' + auc.id + '">' +
      '<div class="flex"><div class="ac-title">' + auc.itemName + '</div><span class="badge ' + badgeCls + '">' + badgeTxt + '</span></div>' +
      '<div class="ac-meta">' +
        '<span>🏁 시작가 ' + (auc.startPrice||0) + 'P</span>' +
        '<span>📈 현재 최고 <strong class="green">' + highBid + 'P</strong></span>' +
        (myTotal > 0 ? '<span>내 입찰 <strong style="color:var(--accent2)">' + myTotal + 'P</strong></span>' : '') +
      '</div>' +
      '<div class="ac-bid-row">' +
        '<div class="step-group">' +
          '<button onclick="stepBid(\'' + auc.id + '\',-1)">−</button>' +
          '<div class="step-val" id="step-' + auc.id + '">' + minBid + 'P</div>' +
          '<button onclick="stepBid(\'' + auc.id + '\',1)">+</button>' +
        '</div>' +
        '<button class="btn btn-primary" style="flex:1" onclick="placeBid(\'' + auc.id + '\')">입찰</button>' +
      '</div>' +
    '</div>';
  } else {
    var won = auc.winner && String(auc.winner.studentId) === String(s.id);
    return '<div class="auction-card">' +
      '<div class="flex"><div class="ac-title">' + auc.itemName + '</div><span class="badge badge-ended">종료</span></div>' +
      '<div class="ac-meta"><span>🏁 시작가 ' + (auc.startPrice||0) + 'P</span></div>' +
      '<div style="margin-top:10px">' +
        (auc.winner
          ? '<span class="badge badge-winner">🏆 낙찰자: ' + auc.winner.studentName + '  ' + auc.winner.amount + 'P</span>' +
            (won ? '<div style="margin-top:8px;color:var(--orange);font-weight:700">🎉 낙찰되었습니다!</div>' : '')
          : '<span class="badge badge-ended">낙찰자 없음</span>') +
      '</div>' +
    '</div>';
  }
}

function stepBid(aucId, dir) {
  var el   = document.getElementById('step-' + aucId);
  if (!el) return;
  var cur  = parseInt(el.textContent) || 0;
  var next = cur + dir * STEP;
  var auc     = DATA.auctions[aucId];
  var bids    = Object.values(auc.bids || {}).map(function(b){ return b.amount; });
  var highBid = bids.length ? Math.max.apply(null, bids) : 0;
  var minBid  = highBid > 0 ? highBid + STEP : (auc.startPrice || 10);
  if (minBid % STEP !== 0) minBid = Math.ceil(minBid / STEP) * STEP;
  if (next < minBid) next = minBid;
  el.textContent = next + 'P';
}

async function placeBid(aucId) {
  var auc = DATA.auctions[aucId];
  if (!auc || !auc.active) return;
  var el  = document.getElementById('step-' + aucId);
  var amt = parseInt(el ? el.textContent : 0);
  if (!amt || amt <= 0) { alert('입찰 금액을 설정하세요.'); return; }
  if (amt % STEP !== 0) { alert('호가 단위는 ' + STEP + 'P 입니다.'); return; }
  var s = getMe();
  var bids    = Object.values(auc.bids || {}).map(function(b){ return b.amount; });
  var highBid = bids.length ? Math.max.apply(null, bids) : 0;
  var minBid  = highBid > 0 ? highBid + STEP : (auc.startPrice || 10);
  if (amt < minBid) { alert('최소 입찰 금액은 ' + minBid + 'P 입니다.'); return; }
  if (s.points < amt) { alert('포인트가 부족합니다.'); return; }

  var sid = String(s.id);
  var prev = auc.bids && auc.bids[sid] ? auc.bids[sid].amount : 0;
  var diff = amt - prev;
  if (diff <= 0) { alert('현재 내 입찰보다 높은 금액을 입력하세요.'); return; }
  if (s.points < diff) { alert('포인트가 부족합니다.'); return; }

  s.points -= diff;
  if (!s.history) s.history = [];
  s.history.push({label:'경매 입찰 - ' + auc.itemName + ' (' + amt + 'P)', points:-diff, date:today()});
  if (!auc.bids) auc.bids = {};
  auc.bids[sid] = {studentName:s.name, amount:amt};

  await dbSave();
  showToast('🔨 입찰 완료! ' + amt + 'P');
  renderStudent();
}

/* ── 폴링 ── */
var auctionPollTimer = null;
function startAuctionPoll() {
  stopAuctionPoll();
  auctionPollTimer = setInterval(async function() {
    if (!currentUser || currentUser.role !== 'student') { stopAuctionPoll(); return; }
    try {
      var res  = await fetch(FIREBASE_URL);
      var json = await res.json();
      if (json) {
        DATA = json;
        if (!DATA.auctions) DATA.auctions = {};
        if (!DATA.students) DATA.students = [];
        if (!DATA.vocabTests) DATA.vocabTests = {};
      }
    } catch(e) { return; }
    var auctionPanel = document.getElementById('s-auction');
    if (auctionPanel && auctionPanel.classList.contains('active')) {
      renderStudentAuctionList();
    }
    var vocabPanel = document.getElementById('s-vocab');
    if (vocabPanel && vocabPanel.classList.contains('active') && !currentQuiz) {
      renderStudentVocabList();
    }
    var s = getMe();
    if (s) document.getElementById('studentPoints').innerText = s.points;
  }, 4000);
}
function stopAuctionPoll() {
  if (auctionPollTimer) { clearInterval(auctionPollTimer); auctionPollTimer = null; }
}

async function addStudent() {
  var name = document.getElementById('newName').value.trim();
  var id   = document.getElementById('newId').value.trim();
  var pw   = document.getElementById('newPw').value.trim();
  if (!name || !id || !pw) { alert('이름, 아이디, 비밀번호를 모두 입력하세요.'); return; }
  if (DATA.students.find(function(s){ return s.id === id; })) { alert('이미 사용 중인 아이디입니다.'); return; }
  DATA.students.push({id:id, pw:pw, name:name, points:0, history:[], vocabResults:{}});
  await dbSave();
  document.getElementById('newName').value = '';
  document.getElementById('newId').value   = '';
  document.getElementById('newPw').value   = '';
  showToast('✅ ' + name + ' 학생이 추가되었습니다.');

async function deleteStudent(sid) {
  var s = DATA.students.find(function(x){ return x.id === sid; });
  if (!s) return;
  if (!confirm(s.name + ' 학생을 삭제하시겠습니까?\n(포인트 내역도 모두 삭제됩니다)')) return;
  DATA.students = DATA.students.filter(function(x){ return x.id !== sid; });
  await dbSave();
  showToast('🗑️ ' + s.name + ' 삭제 완료');
  renderStudents();
}

function renderStudents() {
  document.getElementById('studentList').innerHTML = DATA.students.map(function(s) {
    return '<div class="student-card flex">' +
      '<div><div style="font-weight:600">' + s.name + '</div><div class="small">ID: ' + s.id + ' · PW: ' + s.pw + '</div></div>' +
      '<div style="display:flex;align-items:center;gap:10px">' +
        '<div class="green" style="font-weight:700">' + s.points + 'P</div>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteStudent(\'' + s.id + '\')">삭제</button>' +
      '</div>' +
    '</div>';
  }).join('') || '<div class="empty">등록된 학생이 없습니다.</div>';

  var opts = DATA.students.map(function(s) {
    return '<option value="' + s.id + '">' + s.name + '</option>';
  }).join('');
  document.getElementById('giveStudent').innerHTML = opts;

  var hs = document.getElementById('historyStudent');
  var prev = hs.value;
  hs.innerHTML = opts;
  if (prev) hs.value = prev;
  renderPointHistory();
}

async function givePoint() {
  var sid    = document.getElementById('giveStudent').value;
  var amt    = parseInt(document.getElementById('giveAmt').value);
  var reason = document.getElementById('giveReason').value.trim() || '관리자 지급';
  if (!sid || isNaN(amt) || amt === 0) { alert('학생과 포인트를 입력하세요.'); return; }
  var s = DATA.students.find(function(x){ return x.id === sid; });
  if (!s) return;
  s.points += amt;
  if (!s.history) s.history = [];
  s.history.push({label:reason, points:amt, date:today()});
  await dbSave();
  document.getElementById('giveAmt').value    = '';
  document.getElementById('giveReason').value = '';
  renderAdmin();
}

  var s = DATA.students.find(function(x){ return x.id === hs.value; });
  ph.innerHTML = historyRows(s ? s.history : null);
}

  var el   = document.getElementById('adminAuctionList');
  var list = Object.values(DATA.auctions || {});
  if (!list.length) { el.innerHTML = '<div class="empty">진행 중인 경매가 없습니다.</div>'; return; }
  el.innerHTML = list.map(function(auc) {
    return buildAdminAuctionCard(auc);
  }).join('');
}

function buildAdminAuctionCard(auc) {
  var sorted = Object.entries(auc.bids || {}).map(function(e){
    return {id:e[0], studentName:e[1].studentName, amount:e[1].amount};
  }).sort(function(a,b){ return b.amount - a.amount; });
  var highBid = sorted.length ? sorted[0].amount : 0;
  var rows = sorted.map(function(b,i){
    return '<tr><td>' + (i+1) + '</td><td>' + b.studentName + '</td><td class="green">' + b.amount + 'P</td></tr>';
  }).join('');

  var badge = auc.active
    ? '<span class="badge badge-active">진행 중</span>'
    : '<span class="badge badge-ended">종료</span>';
  var action = auc.active
    ? '<button class="btn btn-danger btn-sm" onclick="endAuction(\'' + auc.id + '\')">경매 종료</button>'
    : '<button class="btn btn-danger btn-sm" onclick="deleteAuction(\'' + auc.id + '\')">삭제</button>';

  return '<div class="admin-auction-card">' +
    '<div class="aa-header">' +
      '<div>' +
        '<div class="aa-title">' + auc.itemName + '</div>' +
        '<div class="small" style="margin-top:4px">시작가 ' + (auc.startPrice||0) + 'P · 호가 ' + STEP + 'P 단위 · 현재 최고 <span class="green">' + highBid + 'P</span></div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px">' + badge + action + '</div>' +
    '</div>' +
    (auc.winner
      ? '<div style="margin-bottom:10px"><span class="badge badge-winner">🏆 낙찰: ' + auc.winner.studentName + '  ' + auc.winner.amount + 'P</span></div>'
      : '') +
    (rows
      ? '<table class="table"><thead><tr><th>순위</th><th>학생</th><th>입찰</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="empty" style="padding:10px 0">아직 입찰자가 없습니다.</div>') +
  '</div>';
}

async function startAuction() {
  var item  = document.getElementById('auctionItem').value.trim();
  var start = parseInt(document.getElementById('auctionStart').value);
  if (!item)           { alert('경매 상품명을 입력하세요.'); return; }
  if (isNaN(start) || start < STEP) { alert('최소 시작가를 ' + STEP + 'P 이상으로 입력하세요.'); return; }
  if (start % STEP !== 0) { alert('시작가는 ' + STEP + 'P 단위여야 합니다.'); return; }
  var id = 'auc_' + Date.now();
  DATA.auctions[id] = {
    id:id,
    itemName:item,
    startPrice:start,
    active:true,
    bids:{},
    winner:null,
    createdAt:today()
  };
  await dbSave();
  document.getElementById('auctionItem').value  = '';
  document.getElementById('auctionStart').value = '';
  renderAdminAuctionList();
  showToast('🔨 경매 시작: ' + item);
}

async function endAuction(aucId) {
  var auc = DATA.auctions[aucId];
  if (!auc) return;
  var sorted = Object.entries(auc.bids || {}).map(function(e){
    return {studentId:e[0], studentName:e[1].studentName, amount:e[1].amount};
  }).sort(function(a,b){ return b.amount - a.amount; });
  auc.active = false;
  var winner = sorted[0] || null;
  auc.winner = winner;
  if (winner) {
    var ws = DATA.students.find(function(x){ return String(x.id) === String(winner.studentId); });
    if (ws) {
      if (!ws.history) ws.history = [];
      ws.history.push({label:'경매 낙찰 - ' + auc.itemName, points:-winner.amount, date:today()});
    }
  }
  await dbSave();
  renderAdminAuctionList();
  showToast('🏁 경매 종료: ' + auc.itemName);
}

async function deleteAuction(aucId) {
  if (!confirm('이 경매를 삭제하시겠습니까?')) return;
  delete DATA.auctions[aucId];
  await dbSave();
  renderAdminAuctionList();
}

function renderOrders() {
  var el = document.getElementById('orderList');
  if (!DATA.orders.length) { el.innerHTML = '<div class="empty">주문 내역이 없습니다.</div>'; return; }
  el.innerHTML = DATA.orders.map(function(o){
    return '<div class="order-card"><div>' + o.studentName + '</div><div class="small">' + o.itemName + '</div></div>';
  }).join('');
}

function studentTab(id, el) {
  document.querySelectorAll('#studentMain .tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('#studentMain .panel').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('s-' + id).classList.add('active');
  if (id === 'vocab') { currentQuiz = null; renderStudentVocabList(); }
}
function adminTab(id, el) {
  document.querySelectorAll('#adminMain .tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('#adminMain .panel').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('a-' + id).classList.add('active');
}

/* ── [기능 2] 단어시험 관리자 페이지 (학생별 점수 및 오답 확인) ── */
function renderAdminVocab() {
  var el = document.getElementById('adminVocabList');
  if (!el) return;
  var html = '';
  for (var i = 1; i <= 30; i++) {
    var key = 'day' + i;
    var wordCount = (VOCAB_DATA[key] || []).length;
    var conf = (DATA.vocabTests && DATA.vocabTests[key]) ? DATA.vocabTests[key] : {open:false};
    
    // 해당 Day에 시험을 친 학생들
    var studentResults = [];
    DATA.students.forEach(function(s) {
      if (s.vocabResults && s.vocabResults[key] && s.vocabResults[key].completed) {
        studentResults.push({
          studentId: s.id,
          studentName: s.name,
          res: s.vocabResults[key]
        });
      }
    });

    var studentListHtml = '';
    if (studentResults.length > 0) {
      studentListHtml = '<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">' +
        '<div class="small" style="font-weight:700;margin-bottom:6px;color:var(--text2)">응시 학생 목록 (클릭시 오답 상세)</div>' +
        '<div style="display:flex;flex-direction:column;gap:6px">';
      studentResults.forEach(function(sr) {
        var wrongCount = sr.res.wrongList ? sr.res.wrongList.length : 0;
        var earnedPoints = sr.res.score * 10;
        studentListHtml += '<div class="history flex" style="padding:6px 0;cursor:pointer" onclick="viewAdminStudentWrong(\'' + sr.studentId + '\', \'' + key + '\')">' +
          '<div><strong style="color:var(--accent2)">' + sr.studentName + '</strong> <span class="small">(' + sr.res.score + '/' + sr.res.total + '개 맞춤 · <span class="green">+' + earnedPoints + 'P</span>)</span></div>' +
          '<div class="small red">' + (wrongCount > 0 ? wrongCount + '개 틀림 🔍' : '<span class="green">만점 💯</span>') + '</div>' +
        '</div>';
      });
      studentListHtml += '</div></div>';
    } else {
      studentListHtml = '<div class="small" style="margin-top:10px;color:var(--text3)">아직 응시한 학생이 없습니다.</div>';
    }

    html += '<div class="admin-auction-card">' +
      '<div class="aa-header">' +
        '<div>' +
          '<div class="aa-title">Day ' + i + ' 단어 시험</div>' +
          '<div class="small" style="margin-top:4px">총 ' + wordCount + '문제 (문제당 10P) · 응시 완료 ' + studentResults.length + '명 / 전체 ' + DATA.students.length + '명</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (conf.open
            ? '<span class="badge badge-active">열림</span><button class="btn btn-danger btn-sm" onclick="toggleVocabDay(\'' + key + '\')">닫기</button>'
            : '<span class="badge badge-ended">닫힘</span><button class="btn btn-success btn-sm" onclick="toggleVocabDay(\'' + key + '\')">열기</button>') +
        '</div>' +
      '</div>' +
      studentListHtml +
    '</div>';
  }
  el.innerHTML = html;
}

function viewAdminStudentWrong(studentId, key) {
  var s = DATA.students.find(function(x){ return x.id === studentId; });
  if (!s || !s.vocabResults || !s.vocabResults[key]) return;
  var res = s.vocabResults[key];
  var dayNum = key.replace('day', '');
  
  var wrongHtml = '';
  if (!res.wrongList || res.wrongList.length === 0) {
    wrongHtml = '<div class="empty">🎉 모든 문제를 맞췄습니다!</div>';
  } else {
    wrongHtml = res.wrongList.map(function(w) {
      return '<div class="history" style="padding:8px 0">' +
        '<div style="font-weight:700;font-size:15px">' + w.word + '</div>' +
        '<div class="small red" style="margin-top:2px">학생 선택: ' + w.selected + '</div>' +
        '<div class="small green">실제 정답: ' + w.correct + '</div>' +
      '</div>';
    }).join('');
  }

  var modalContainer = document.getElementById('adminVocabList');
  modalContainer.innerHTML = '<div class="admin-section">' +
    '<div class="flex" style="margin-bottom:12px">' +
      '<div style="font-size:16px;font-weight:800">' + s.name + ' 학생의 Day ' + dayNum + ' 오답 노트</div>' +
      '<span class="badge badge-winner">' + res.score + ' / ' + res.total + '점 (+' + (res.score*10) + 'P 적립)</span>' +
    '</div>' +
    wrongHtml +
    '<button class="btn btn-primary btn-full" style="margin-top:16px" onclick="renderAdminVocab()">목록으로 돌아가기</button>' +
  '</div>';
}

async function toggleVocabDay(key) {
  if (!DATA.vocabTests) DATA.vocabTests = {};
  if (!DATA.vocabTests[key]) DATA.vocabTests[key] = {open:false};
  DATA.vocabTests[key].open = !DATA.vocabTests[key].open;
  await dbSave();
  renderAdminVocab();
  showToast(DATA.vocabTests[key].open ? '✅ Day ' + key.replace('day','') + ' 시험 열림' : '🔒 Day ' + key.replace('day','') + ' 시험 닫힘');
}

/* ── 단어시험 : 학생 ── */
function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildVocabQuestions(key) {
  var words = VOCAB_DATA[key] || [];
  var allMeanings = words.map(function(w){ return w[1]; });
  var questions = words.map(function(w) {
    var correct = w[1];
    var pool = allMeanings.filter(function(m){ return m !== correct; });
    var distractors = shuffleArray(pool).slice(0, 3);
    var options = shuffleArray([correct].concat(distractors));
    return {word: w[0], correct: correct, options: options};
  });
  return shuffleArray(questions);
}

function renderStudentVocabList() {
  var el = document.getElementById('studentVocabList');
  if (!el) return;
  var s = getMe();
  if (!s.vocabResults) s.vocabResults = {};
  var openDays = [];
  for (var i = 1; i <= 30; i++) {
    var key = 'day' + i;
    if (DATA.vocabTests && DATA.vocabTests[key] && DATA.vocabTests[key].open) openDays.push(key);
  }
  if (!openDays.length) { el.innerHTML = '<div class="empty">아직 열린 단어 시험이 없습니다.</div>'; return; }
  el.innerHTML = openDays.map(function(key) {
    var dayNum = key.replace('day', '');
    var result = s.vocabResults[key];
    if (result && result.completed) {
      return '<div class="auction-card"><div class="flex"><div class="ac-title">Day ' + dayNum + ' 단어 시험</div>' +
        '<span class="badge badge-winner">' + result.score + ' / ' + result.total + '점 (+' + (result.score*10) + 'P)</span></div>' +
        '<div class="ac-meta"><span>📅 응시일 ' + result.date + '</span></div>' +
        '<div class="ac-bid-row"><button class="btn btn-primary" style="flex:1" onclick="showVocabWrong(\'' + key + '\')">오답 확인</button></div></div>';
    } else {
      var wordCount = (VOCAB_DATA[key] || []).length;
      return '<div class="auction-card"><div class="flex"><div class="ac-title">Day ' + dayNum + ' 단어 시험</div>' +
        '<span class="badge badge-active">응시 가능</span></div>' +
        '<div class="ac-meta"><span>📝 총 ' + wordCount + '문제 · 1문제당 10P 적립</span></div>' +
        '<div class="ac-bid-row"><button class="btn btn-primary" style="flex:1" onclick="startVocabTest(\'' + key + '\')">시험 시작</button></div></div>';
    }
  }).join('');
}

function startVocabTest(key) {
  var s = getMe();
  if (s.vocabResults && s.vocabResults[key] && s.vocabResults[key].completed) {
    alert('이미 응시한 시험입니다. 재응시는 불가능합니다.');
    renderStudentVocabList();
    return;
  }
  if (!confirm('Day ' + key.replace('day','') + ' 단어 시험을 시작하시겠습니까?\n한 번 시작하면 재응시가 불가능합니다.')) return;
  currentQuiz = {key: key, questions: buildVocabQuestions(key), index: 0, wrong: []};
  renderVocabQuestion();
}

function renderVocabQuestion() {
  var el = document.getElementById('studentVocabList');
  var q = currentQuiz.questions[currentQuiz.index];
  var progress = (currentQuiz.index + 1) + ' / ' + currentQuiz.questions.length;
  var dayNum = currentQuiz.key.replace('day', '');
  var html = '<div class="auction-card">' +
    '<div class="flex"><div class="ac-title">Day ' + dayNum + ' 단어 시험</div><span class="small">' + progress + '</span></div>' +
    '<div style="font-size:26px;font-weight:800;margin:24px 0;text-align:center;color:var(--accent2)">' + q.word + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px">' +
      q.options.map(function(opt, i) {
        return '<button class="btn opt-btn" onclick="answerVocabQuestion(' + i + ')">' + (i+1) + '. ' + opt + '</button>';
      }).join('') +
    '</div></div>';
  el.innerHTML = html;
}

function answerVocabQuestion(i) {
  var q = currentQuiz.questions[currentQuiz.index];
  var selected = q.options[i];
  if (selected !== q.correct) {
    currentQuiz.wrong.push({word: q.word, correct: q.correct, selected: selected});
  }
  currentQuiz.index++;
  if (currentQuiz.index < currentQuiz.questions.length) {
    renderVocabQuestion();
  } else {
    finishVocabTest();
  }
}

/* ── [기능 3] 단어시험 완료 시 1문제당 10점 자동 적립 ── */
async function finishVocabTest() {
  var s = getMe();
  if (!s.vocabResults) s.vocabResults = {};
  var total = currentQuiz.questions.length;
  var wrongCount = currentQuiz.wrong.length;
  var score = total - wrongCount; // 맞춘 개수
  var earnedPoints = score * 10;   // 1문제당 10점 적립
  var key = currentQuiz.key;
  var dayNum = key.replace('day', '');

  // 포인트 적립 처리
  s.points += earnedPoints;
  if (!s.history) s.history = [];
  s.history.push({
    label: '단어시험 적립 - Day ' + dayNum + ' (' + score + '/' + total + '개 맞춤)',
    points: earnedPoints,
    date: today()
  });

  s.vocabResults[key] = {
    completed: true, 
    score: score, 
    total: total, 
    wrongList: currentQuiz.wrong, 
    date: today()
  };

  await dbSave();
  currentQuiz = null;
  showToast('🎉 시험 완료! ' + earnedPoints + 'P 가 적립되었습니다.');
  showVocabResult(key, score, total, earnedPoints);
}

function showVocabResult(key, score, total, earnedPoints) {
  var el = document.getElementById('studentVocabList');
  var dayNum = key.replace('day', '');
  el.innerHTML = '<div class="auction-card" style="text-align:center">' +
    '<div class="ac-title" style="margin-bottom:10px">Day ' + dayNum + ' 시험 결과</div>' +
    '<div style="font-size:44px;font-weight:800;color:var(--green);margin:10px 0">' + score + ' / ' + total + '</div>' +
    '<div style="font-size:16px;color:var(--accent2);font-weight:700;margin-bottom:16px">🎁 포인트 ' + earnedPoints + 'P 적립 완료!</div>' +
    '<div style="display:flex;gap:8px;margin-top:16px">' +
      '<button class="btn btn-primary" style="flex:1" onclick="showVocabWrong(\'' + key + '\')">오답 확인</button>' +
      '<button class="btn" style="flex:1;background:var(--surface2);color:var(--text)" onclick="renderStudentVocabList()">목록으로</button>' +
    '</div></div>';
}

function showVocabWrong(key) {
  var s = getMe();
  var result = s.vocabResults[key];
  var el = document.getElementById('studentVocabList');
  var dayNum = key.replace('day', '');
  if (!result || !result.wrongList || !result.wrongList.length) {
    el.innerHTML = '<div class="auction-card" style="text-align:center">' +
      '<div class="ac-title" style="margin-bottom:10px">Day ' + dayNum + ' 오답 노트</div>' +
      '<div class="empty">🎉 틀린 문제가 없습니다! 만점입니다.</div>' +
      '<button class="btn btn-primary btn-full" onclick="renderStudentVocabList()">목록으로</button></div>';
    return;
  }
  var rows = result.wrongList.map(function(w) {
    return '<div class="history"><div style="font-weight:700">' + w.word + '</div>' +
      '<div class="small" style="color:var(--red);margin-top:4px">내가 고른 답: ' + w.selected + '</div>' +
      '<div class="small" style="color:var(--green)">정답: ' + w.correct + '</div></div>';
  }).join('');
  el.innerHTML = '<div class="auction-card">' +
    '<div class="flex"><div class="ac-title">Day ' + dayNum + ' 오답 노트</div><span class="badge badge-ended">' + result.wrongList.length + '개 틀림</span></div>' +
    rows +
    '<button class="btn btn-primary btn-full" style="margin-top:14px" onclick="renderStudentVocabList()">목록으로</button></div>';
}
</script>
