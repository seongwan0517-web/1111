<script>
const FIREBASE_URL = "https://point-7419d-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";
const STEP = 10; 

let DATA = { students:[], items:[], orders:[], auctions:{}, vocabTests:{}, vocabSubmissions:{} };
let currentUser = null;
let currentQuiz = null;

// [VOCAB_DATA 생략 - 기존 단어 데이터 유지]

async function loadData(){
  try{
    let r = await fetch(FIREBASE_URL);
    let d = await r.json();
    if(d){
      DATA = d;
      if(!DATA.students) DATA.students = [];
      if(!DATA.items) DATA.items = [];
      if(!DATA.orders) DATA.orders = [];
      if(!DATA.auctions) DATA.auctions = {};
      if(!DATA.vocabTests) DATA.vocabTests = {};
      if(!DATA.vocabSubmissions) DATA.vocabSubmissions = {};
    }
  }catch(e){
    console.error("데이터 로드 실패:", e);
  }
}

async function saveData(){
  try{
    await fetch(FIREBASE_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(DATA)
    });
  }catch(e){
    console.error("데이터 저장 실패:", e);
  }
}

// ── 로그인 & 로그아웃 ──
async function login(){
  await loadData();
  let id = document.getElementById('loginId').value.trim();
  let pw = document.getElementById('loginPw').value.trim();
  let err = document.getElementById('loginErr');
  err.style.display = 'none';

  if(id === 'admin' && pw === 'admin1234'){
    currentUser = { role:'admin', name:'관리자' };
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminMain').style.display = 'block';
    renderAdmin();
    return;
  }

  let st = DATA.students.find(s => s.id === id && s.pw === pw);
  if(st){
    currentUser = { role:'student', ...st };
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('studentMain').style.display = 'block';
    document.getElementById('studentName').innerText = `${st.name} 학생`;
    renderStudent();
    return;
  }
  err.style.display = 'block';
}

function logout(){
  currentUser = null;
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('studentMain').style.display = 'none';
  document.getElementById('adminMain').style.display = 'none';
}

// ── 교사: 단어시험 관리 기능 (문제 1, 2, 3 해결) ──
async function toggleVocabTest(day){
  await loadData();
  let currentStatus = DATA.vocabTests[day] || false;
  
  // 핵심 수정: 시험을 닫더라도 제출된 데이터(vocabSubmissions)와 포인트를 절대 삭제하지 않음!
  DATA.vocabTests[day] = !currentStatus;
  
  await saveData();
  showToast(DATA.vocabTests[day] ? `${day} 시험이 열렸습니다.` : `${day} 시험이 마감되었습니다.`);
  renderAdminVocab();
}

function renderAdminVocab(){
  let h = '';
  Object.keys(VOCAB_DATA).forEach(day => {
    let isOpen = DATA.vocabTests[day] || false;
    
    // 교사가 제출한 학생 목록 및 틀린 항목을 확인하는 기능
    let submittedStudents = [];
    if(DATA.vocabSubmissions[day]){
      Object.keys(DATA.vocabSubmissions[day]).forEach(stId => {
        let sub = DATA.vocabSubmissions[day][stId];
        let wrongWords = sub.details ? sub.details.filter(w => !w.isCorrect) : [];
        submittedStudents.push({ ...sub, wrongWords });
      });
    }

    h += `<div class="admin-auction-card">
      <div class="aa-header">
        <div>
          <div class="aa-title" style="font-size:16px;font-weight:800">${day.toUpperCase()} (${VOCAB_DATA[day].length}단어)</div>
          <div class="small">상태: ${isOpen ? '<span class="green">응시 가능 (OPEN)</span>' : '<span class="red">마감됨 (CLOSED)</span>'}</div>
        </div>
        <button class="btn ${isOpen ? 'btn-danger' : 'btn-success'} btn-sm" onclick="toggleVocabTest('${day}')">
          ${isOpen ? '시험 닫기' : '시험 열기'}
        </button>
      </div>`;

    if(submittedStudents.length > 0){
      h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div class="small" style="font-weight:700;color:var(--accent2);margin-bottom:6px">학생별 오답 제출 내역</div>`;
      submittedStudents.forEach(st => {
        h += `<div style="background:var(--surface);padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px">
          <div class="flex">
            <strong>${st.studentName} (${st.studentId})</strong>
            <span class="green">${st.score}점 획득</span>
          </div>`;
        
        if(st.wrongWords.length > 0){
          h += `<div class="red" style="font-size:12px;margin-top:4px">
            틀린 단어 (${st.wrongWords.length}개): ${st.wrongWords.map(w => `${w.word}(작성: ${w.userAns || '미입력'})`).join(', ')}
          </div>`;
        } else {
          h += `<div class="green" style="font-size:12px;margin-top:4px">만점 (틀린 단어 없음)</div>`;
        }
        h += `</div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  });
  document.getElementById('adminVocabList').innerHTML = h;
}

// ── 학생: 단어시험 및 오답 노트 기능 ──
function renderStudentVocab(){
  let h = '';
  Object.keys(VOCAB_DATA).forEach(day => {
    let isOpen = DATA.vocabTests[day] || false;
    let mySub = DATA.vocabSubmissions[day] ? DATA.vocabSubmissions[day][currentUser.id] : null;

    h += `<div class="shop-item flex" style="flex-direction:column;align-items:stretch;gap:10px">
      <div class="flex">
        <div>
          <strong style="font-size:16px">${day.toUpperCase()}</strong>
          <span class="small" style="margin-left:8px">총 ${VOCAB_DATA[day].length}문항</span>
        </div>`;

    // 핵심 수정: 시험이 닫혀도 제출 기록(mySub)이 있으면 오답 확인 가능!
    if(mySub){
      h += `<span class="badge badge-winner">제출완료 (${mySub.score}점)</span></div>`;
      h += `<button class="btn btn-primary btn-sm" onclick="viewMyWrongAnswers('${day}')">오답 노트 및 제출 답안 확인</button>`;
    } else if(isOpen){
      h += `<span class="badge badge-active">응시 가능</span></div>`;
      h += `<button class="btn btn-success btn-sm" onclick="startQuiz('${day}')">시험 응시하기</button>`;
    } else {
      h += `<span class="badge badge-ended">마감됨</span></div>`;
      h += `<div class="small red">시험이 마감되어 응시할 수 없습니다.</div>`;
    }
    h += `</div>`;
  });
  document.getElementById('studentVocabList').innerHTML = h;
}

// 학생 오답 확인 모달/화면
function viewMyWrongAnswers(day){
  let mySub = DATA.vocabSubmissions[day][currentUser.id];
  let h = `<div style="background:var(--surface2);padding:16px;border-radius:12px;margin-bottom:16px">
    <div class="flex" style="margin-bottom:12px">
      <h3 style="color:var(--accent2)">${day.toUpperCase()} 내 제출 결과</h3>
      <button class="btn btn-danger btn-sm" onclick="renderStudentVocab()">목록으로</button>
    </div>
    <div style="margin-bottom:10px"><strong>획득 점수:</strong> ${mySub.score}점</div>
    <div class="space-y-2">`;

  mySub.details.forEach((item, idx) => {
    h += `<div style="background:var(--surface);padding:10px;border-radius:8px;margin-bottom:6px;border:1px solid ${item.isCorrect ? 'rgba(45,212,160,.3)' : 'rgba(255,107,107,.3)'}">
      <div><strong>${idx+1}. ${item.word}</strong> (정답: ${item.correctAns})</div>
      <div class="small" style="margin-top:4px">
        내가 쓴 답: <span class="${item.isCorrect ? 'green' : 'red'}" style="font-weight:700">${item.userAns || '미입력'}</span> 
        ${item.isCorrect ? '<span class="green">(정답)</span>' : '<span class="red">(오답)</span>'}
      </div>
    </div>`;
  });
  h += `</div></div>`;
  document.getElementById('studentVocabList').innerHTML = h;
}

// 시험 제출 처리 (상세 정/오답 기록 저장)
async function submitQuiz(day){
  await loadData();
  let words = VOCAB_DATA[day];
  let score = 0;
  let details = [];

  words.forEach((w, i) => {
    let userAns = document.getElementById(`q_${i}`).value.trim();
    let isCorrect = userAns === w[1].trim();
    if(isCorrect) score += 10;

    // 틀린 단어 및 정답 상세 데이터 수집
    details.push({
      word: w[0],
      correctAns: w[1],
      userAns: userAns,
      isCorrect: isCorrect
    });
  });

  if(!DATA.vocabSubmissions[day]) DATA.vocabSubmissions[day] = {};

  // 제출 결과 DB 저장 (시험을 닫아도 삭제되지 않음)
  DATA.vocabSubmissions[day][currentUser.id] = {
    studentId: currentUser.id,
    studentName: currentUser.name,
    score: score,
    details: details,
    submittedAt: new Date().toLocaleString()
  };

  // 학생 포인트 지급 및 내역 기록
  let student = DATA.students.find(s => s.id === currentUser.id);
  if(student){
    student.points = (student.points || 0) + score;
    currentUser.points = student.points;
    if(!student.history) student.history = [];
    student.history.unshift({
      date: new Date().toLocaleDateString(),
      amt: score,
      reason: `${day.toUpperCase()} 단어시험 (${score}점)`
    });
  }

  await saveData();
  showToast(`${score}점을 획득했습니다!`);
  renderStudent();
}

// ── 기타 공통 UI 렌더링 함수들 (기존 기능 유지) ──
function studentTab(tab, el){
  document.querySelectorAll('#studentMain .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#studentMain .panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`s-${tab}`).classList.add('active');
  if(tab === 'vocab') renderStudentVocab();
}

function adminTab(tab, el){
  document.querySelectorAll('#adminMain .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#adminMain .panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`a-${tab}`).classList.add('active');
  if(tab === 'vocab') renderAdminVocab();
}

function showToast(msg){
  let t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function renderStudent(){
  document.getElementById('studentPoints').innerText = currentUser.points || 0;
  renderStudentVocab();
}

function renderAdmin(){
  renderAdminVocab();
}

// 퀴즈 시작 화면
function startQuiz(day){
  let words = VOCAB_DATA[day];
  let h = `<div style="background:var(--surface2);padding:20px;border-radius:14px">
    <div class="flex" style="margin-bottom:16px">
      <h3>${day.toUpperCase()} 단어시험</h3>
      <button class="btn btn-danger btn-sm" onclick="renderStudentVocab()">취소</button>
    </div>`;
  
  words.forEach((w, i) => {
    h += `<div class="field">
      <label>${i+1}. ${w[0]}</label>
      <input type="text" id="q_${i}" placeholder="뜻을 입력하세요">
    </div>`;
  });

  h += `<button class="btn btn-primary btn-full" onclick="submitQuiz('${day}')" style="margin-top:10px">제출하기</button></div>`;
  document.getElementById('studentVocabList').innerHTML = h;
}
</script>
